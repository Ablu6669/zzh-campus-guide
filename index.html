<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园新生指南 - 香港中文大学（深圳）</title>
<!-- 阻止 FOUC：在任何渲染前同步设置主题 -->
<script>
(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark')})();
</script>
<style>



/* ===================================
   设计系统 | Design System
   =================================== */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

:root {
    /* 主色 | Primary — 港中大校徽紫 Pantone 255 */
    --color-primary: #750F6D;
    --color-primary-dark: #5A0C53;
    --color-primary-light: #F8E8F5;
    --color-primary-hover: #F0D8EB;

    /* 辅助金 | Gold — 校徽金 Pantone 117 */
    --color-gold: #DDA300;
    --color-gold-light: #FFF8E1;
    --color-gold-deep: #B8860B;

    /* 文字色 | Text */
    --color-heading: #1a1030;
    --color-body: #3d2c5a;
    --color-muted: #6b5a8a;
    --color-light: #a08cbf;
    --color-faint: #a08cbf;

    /* 背景色 | Background — 稍深淡紫 */
    --color-bg: #ffffff;
    --color-bg-subtle: #E5DAFF;
    --color-bg-hover: #E0D0FF;

    /* 边框色 | Border */
    --color-border: #e0d9ef;
    --color-border-light: #f0ecf7;
    --color-border-hover: #c8bde8;

    /* 阴影 | Shadows — 紫调克制阴影 */
    --shadow-xs: 0 1px 2px rgba(91,44,142,0.04);
    --shadow-sm: 0 1px 4px rgba(91,44,142,0.06);
    --shadow-md: 0 4px 12px rgba(91,44,142,0.08);
    --shadow-lg: 0 8px 24px rgba(91,44,142,0.10);

    /* 圆角 | Radius — 更克制 */
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 18px;
    --radius-full: 999px;

    /* 过渡 | Transitions */
    --ease-fast: 0.15s ease;
    --ease-base: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --ease-smooth: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-out: 0.25s cubic-bezier(0.16, 1, 0.3, 1);

    /* 间距 | Spacing — 有节奏的层级 */
    --space-xs: 4px;
    --space-sm: 10px;
    --space-md: 16px;
    --space-lg: 28px;
    --space-xl: 48px;
}

/* ===================================
   基础重置 | Reset
   =================================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: var(--color-bg-subtle);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    color: var(--color-body);
}

/* ===================================
   登录页 | Login
   =================================== */
.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
}

.login-box {
    background: var(--color-bg);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-lg);
    padding: 48px 40px;
    max-width: 480px;
    width: 100%;
}

.login-header {
    text-align: center;
    margin-bottom: var(--space-xl);
}

.logo {
    width: 72px;
    height: 72px;
    margin-bottom: var(--space-md);
}

.login-header h1 {
    color: var(--color-heading);
    font-size: 28px;
    font-weight: 700;
    margin-bottom: var(--space-xs);
    letter-spacing: -0.02em;
}

.subtitle {
    color: var(--color-muted);
    font-size: 15px;
}

.login-form h2 {
    color: var(--color-heading);
    font-size: 20px;
    margin-bottom: var(--space-lg);
    text-align: center;
}

.school-select {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: var(--space-lg);
}

.school-option {
    border: 1.5px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 16px;
    cursor: pointer;
    transition: all var(--ease-base);
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
}

.school-option:hover {
    border-color: var(--color-primary);
    background: var(--color-primary-light);
}

.school-option.selected {
    border-color: var(--color-primary);
    background: var(--color-primary-light);
}

.school-option.disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.school-option img {
    width: 56px;
    height: 56px;
    border-radius: var(--radius-sm);
    object-fit: cover;
}

.school-info {
    flex: 1;
}

.school-info h3 {
    color: var(--color-heading);
    font-size: 16px;
    font-weight: 600;
    margin-bottom: var(--space-xs);
}

.school-info p {
    color: var(--color-light);
    font-size: 13px;
}

.check-mark {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--color-primary);
    color: white;
    display: none;
    justify-content: center;
    align-items: center;
    font-size: 16px;
}

.school-option.selected .check-mark {
    display: flex;
}

.login-btn {
    width: 100%;
    padding: 14px;
    background: var(--color-primary);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--ease-base);
}

.login-btn:hover {
    background: var(--color-primary-dark);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
}

.login-btn:active {
    transform: translateY(0);
}

.login-footer {
    text-align: center;
    margin-top: var(--space-lg);
    color: var(--color-light);
    font-size: 13px;
}

/* ===================================
   语言切换按钮 | Language Toggle
   =================================== */
.btn-lang {
    background: var(--color-primary);
    color: #fff;
    border: none;
    border-radius: var(--radius-full);
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--ease-fast);
    margin-right: var(--space-sm);
}
.lang-fixed {
    position: fixed;
    top: 16px; right: 16px;
    z-index: 10001;
    background: var(--color-primary);
    color: #fff;
    border: none;
    border-radius: var(--radius-full);
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--ease-fast);
}
.theme-fixed {
    position: fixed;
    top: 56px; right: 16px;
    z-index: 10001;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2px solid var(--color-border);
    background: var(--color-bg);
    cursor: pointer;
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--ease-fast);
}
.theme-fixed:hover {
    border-color: var(--color-primary);
    background: var(--color-primary-light);
}
[data-theme="dark"] .theme-fixed {
    background: var(--color-bg);
    border-color: var(--color-border);
}
[data-theme="dark"] .theme-fixed:hover {
    background: var(--color-primary-light);
    border-color: var(--color-primary);
}
.btn-lang:hover {
    background: var(--color-primary-dark);
}

/* ===================================
   页面通用头 | Page Header
   =================================== */
.main-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 24px 56px;
}

.page-header {
    background: var(--color-bg);
    padding: 22px 28px;
    border-radius: var(--radius-lg);
    box-shadow: none;
    border: 1px solid var(--color-border-light);
    margin-bottom: 20px;
    transition: border-color var(--ease-base);
}
.page-header h2 { font-size: 20px; font-weight: 600; color: var(--color-heading); letter-spacing: -0.01em; }
.page-header p  { font-size: 13px; color: var(--color-muted); margin-top: 6px; }

.main-header {
    background: var(--color-bg);
    padding: 18px 28px;
    border-radius: var(--radius-lg);
    box-shadow: none;
    border: 1px solid var(--color-border-light);
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.school-badge {
    background: var(--color-primary);
    color: white;
    padding: 6px 14px;
    border-radius: var(--radius-full);
    font-size: 13px;
    font-weight: 500;
}

.header-right {
    display: flex;
    gap: 10px;
}

.btn-secondary {
    padding: 8px 18px;
    background: var(--color-bg-subtle);
    color: var(--color-body);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    transition: all var(--ease-base);
}

.btn-secondary:hover {
    background: var(--color-primary-hover);
    border-color: var(--color-primary);
    color: var(--color-primary);
}

.btn-guide {
    background: none;
    border: 1.5px solid var(--color-gold);
    color: var(--color-gold);
    border-radius: var(--radius-full);
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--ease-fast);
}
.btn-guide:hover {
    background: var(--color-gold);
    color: #fff;
}

.btn-contact {
    background: none;
    border: 1.5px solid var(--color-primary);
    color: var(--color-primary);
    border-radius: var(--radius-full);
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--ease-fast);
}
.btn-contact:hover {
    background: var(--color-primary);
    color: #fff;
}

/* 首页顶部导航栏内的主题按钮 */
.btn-theme {
    background: none;
    border: 1.5px solid var(--color-border);
    color: var(--color-body);
    border-radius: var(--radius-full);
    padding: 6px 12px;
    font-size: 16px;
    cursor: pointer;
    transition: all var(--ease-fast);
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.btn-theme:hover {
    background: var(--color-bg-hover);
    border-color: var(--color-primary);
}
@media (max-width: 768px) {
    .btn-theme { display: none !important; }
}

/* ===================================
   主页功能卡片 | Home Cards
   =================================== */
.main-content {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
}

.card {
    background: #ffffff;
    border-radius: var(--radius-lg);
    padding: 28px 24px;
    box-shadow: 0 1px 3px rgba(91,44,142,0.06), 0 1px 2px rgba(0,0,0,0.04);
    cursor: pointer;
    transition: all var(--ease-out);
    border: 1px solid var(--color-border);
}
    position: relative;
    overflow: hidden;
}

.card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--color-gold);
    opacity: 0;
    transition: opacity var(--ease-base);
}

.card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
    border-color: var(--color-border);
}

.card:hover::before {
    opacity: 1;
}

.card:active {
    transform: translateY(-1px);
}

.card-icon {
    width: 52px;
    height: 52px;
    background: var(--color-gold-light);
    color: var(--color-gold);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin-bottom: 18px;
    transition: transform var(--ease-smooth);
}

.card:hover .card-icon {
    transform: scale(1.08);
}

.card h3 {
    color: var(--color-heading);
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: -0.01em;
}

.card p {
    color: var(--color-muted);
    font-size: 13px;
    line-height: 1.7;
}

/* ===================================
   子页面通用 | Sub-pages
   =================================== */
.page-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 20px 56px;
}

.page-content {
    background: var(--color-bg);
    padding: 28px;
    border-radius: var(--radius-lg);
    box-shadow: none;
    border: 1px solid var(--color-border-light);
}

.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    background: var(--color-bg-subtle);
    color: var(--color-body);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-full);
    cursor: pointer;
    margin-bottom: 18px;
    font-size: 13px;
    font-weight: 500;
    transition: all var(--ease-base);
}

.back-btn:hover {
    background: var(--color-primary);
    color: #fff;
    border-color: var(--color-primary);
}

.back-btn:active {
    transform: scale(0.97);
}

/* ===================================
   联系方式卡片 | Contact Cards
   =================================== */
.contact-card {
    background: #f8f9fa;
    padding: 18px;
    border-radius: var(--radius-md);
    border-left: 3px solid var(--color-primary);
    transition: all var(--ease-out);
}

.contact-card:hover {
    background: #eef1f4;
    transform: translateX(4px);
}

.contact-card h4 {
    color: var(--color-heading);
    font-size: 16px;
    font-weight: 600;
    margin-bottom: var(--space-xs);
}

.contact-card > p {
    color: var(--color-light);
    font-size: 13px;
    margin-bottom: 12px;
}

.contact-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.contact-info p {
    color: var(--color-muted);
    font-size: 13px;
    line-height: 1.6;
}

/* ===================================
   返回按钮增强 | Back Button Enhanced
   （已合并入上方 .back-btn，保留兼容）
   =================================== */

/* ===================================
   页面切换动画 | Page Transition
   =================================== */
.page-container,
.main-container {
    animation: page-enter 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes page-enter {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
}

.page-content {
    animation: content-enter 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.08s both;
}

@keyframes content-enter {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ===================================
   滚动渐显 | Scroll Reveal
   =================================== */
.reveal {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.reveal.reveal-visible {
    opacity: 1;
    transform: translateY(0);
}

.reveal:nth-child(2) { transition-delay: 0.05s; }
.reveal:nth-child(3) { transition-delay: 0.10s; }
.reveal:nth-child(4) { transition-delay: 0.15s; }
.reveal:nth-child(5) { transition-delay: 0.20s; }
.reveal:nth-child(6) { transition-delay: 0.25s; }

/* ===================================
   Toast 提示 | Toast Notification
   =================================== */
.toast-container {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 99999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
}

.toast {
    background: var(--color-bg);
    color: var(--color-body);
    padding: 12px 22px;
    border-radius: var(--radius-full);
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 400px;
    pointer-events: auto;
    animation: toast-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 1px solid var(--color-border-light);
    line-height: 1.5;
}

.toast.toast-success { border-left: 3px solid #07c160; }
.toast.toast-success .toast-icon { color: #07c160; }
.toast.toast-info   { border-left: 3px solid var(--color-primary); }
.toast.toast-info .toast-icon { color: var(--color-primary); }

.toast.toast-out {
    animation: toast-out 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

@keyframes toast-in {
    from { opacity: 0; transform: translateY(-16px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes toast-out {
    to { opacity: 0; transform: translateY(-12px) scale(0.95); }
}

/* ===================================
   骨架屏 | Skeleton Loading
   =================================== */
.skeleton-box {
    background: linear-gradient(90deg,
        var(--color-bg-subtle) 25%,
        #e8e8ee 50%,
        var(--color-bg-subtle) 75%
    );
    background-size: 200% 100%;
    animation: skeleton-shimmer 1.4s ease-in-out infinite;
    border-radius: var(--radius-md);
}

@keyframes skeleton-shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

.skeleton-map {
    width: 100%;
    height: 68vh;
    min-height: 400px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-light);
    font-size: 14px;
    gap: 8px;
}

.skeleton-map .skeleton-spinner {
    width: 22px;
    height: 22px;
    border: 3px solid var(--color-border);
    border-top-color: var(--color-primary);
    border-radius: 50%;
    animation: skeleton-spin 0.7s linear infinite;
}

@keyframes skeleton-spin {
    to { transform: rotate(360deg); }
}

/* ===================================
   空状态 | Empty State
   =================================== */
.empty-state {
    text-align: center;
    padding: 56px 24px;
    color: var(--color-light);
}

.empty-state .empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.5;
    animation: empty-bounce 2s ease-in-out infinite;
}

@keyframes empty-bounce {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-6px); }
}

.empty-state .empty-title {
    font-size: 15px;
    color: var(--color-muted);
    margin-bottom: 6px;
    font-weight: 500;
}

.empty-state .empty-desc {
    font-size: 13px;
    color: var(--color-light);
}

/* ===================================
   卡片点击反馈 | Card Click Feedback
   =================================== */
.card,
.site-card,
.miniapp-card,
.abbr-card,
.phrase-card,
.contact-card,
.canteen-card,
.restaurant-card,
.store-card,
.loc-card {
    position: relative;
    overflow: hidden;
}

.card:active,
.site-card:active,
.miniapp-card:active,
.abbr-card:active,
.phrase-card:active,
.contact-card:active,
.canteen-card:active,
.restaurant-card:active,
.store-card:active,
.loc-card:active {
    transform: scale(0.985);
}

.ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(91, 44, 142, 0.18);
    pointer-events: none;
    transform: scale(0);
    animation: ripple-spread 0.5s ease-out;
}

@keyframes ripple-spread {
    to { transform: scale(2.5); opacity: 0; }
}

/* ===================================
   iPhone 安全区适配 | Safe Area
   =================================== */
.page-container {
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
}

/* ===================================
   响应式 | Responsive
   =================================== */
@media (max-width: 768px) {
    .login-box {
        padding: 36px 24px;
    }

    .login-header h1 {
        font-size: 24px;
    }

    .main-header {
        flex-direction: column;
        gap: 14px;
        text-align: center;
    }

    .main-content {
        grid-template-columns: 1fr;
    }

    .toast {
        max-width: 90vw;
        font-size: 13px;
    }
}

/* ===================================
   回到顶部按钮 | Back to Top Button
   =================================== */
.back-to-top {
    position: fixed;
    bottom: 28px;
    right: 28px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--color-primary);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 18px;
    font-weight: 700;
    box-shadow: var(--shadow-md);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    transition: opacity 0.25s ease, transform 0.25s ease;
}
.back-to-top:hover {
    box-shadow: var(--shadow-lg);
    transform: translateY(-2px);
}
.back-to-top:active {
    transform: translateY(0);
}
.back-to-top.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
}

@media (max-width: 768px) {
    .back-to-top {
        bottom: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        font-size: 18px;
    }
}


        .contact-modal-overlay {
            display: none;
            position: fixed;

/* ===================================
   深色模式 | Dark Mode
   =================================== */
[data-theme="dark"] {
    /* 主色调整 - 深色背景下需要更亮的紫色 */
    --color-primary: #9B4F96;
    --color-primary-dark: #7A3D75;
    --color-primary-light: #2D1F40;
    --color-primary-hover: #3D2A50;

    /* 辅助金调整 */
    --color-gold: #FFB800;
    --color-gold-light: #2A2000;
    --color-gold-deep: #FFC800;

    /* 文字色 - 浅紫色系 */
    --color-heading: #e8d5ff;
    --color-body: #c8b0e8;
    --color-muted: #8a70b0;
    --color-light: #6a5090;
    --color-faint: #6a5090;

    /* 背景色 - 深紫黑 */
    --color-bg: #0f0a1a;
    --color-bg-subtle: #1a1230;
    --color-bg-hover: #251a40;

    /* 边框色 */
    --color-border: #2D1F40;
    --color-border-light: #1F1530;
    --color-border-hover: #3D2A50;

    /* 阴影 - 更深更柔和 */
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-sm: 0 1px 4px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.5);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.6);
}

[data-theme="dark"] .header {
    background: linear-gradient(135deg, #2D1F40 0%, #1A1230 100%);
    box-shadow: 0 2px 20px rgba(0,0,0,0.3);

/* ===================================
   移动端底部导航栏 | Mobile Bottom Nav
   =================================== */
.mobile-bottom-nav {
    display: none; /* 桌面端隐藏 */
}

/* 移动端样式 */
@media (max-width: 768px) {
    /* 移动端保留顶部导航栏，调整布局 */
    .main-header {
        flex-direction: column !important;
        gap: 10px !important;
        padding: 14px 16px !important;
        margin-bottom: 14px !important;
        text-align: center !important;
    }
    .header-left {
        flex-wrap: wrap !important;
        justify-content: center !important;
    }
    .header-right {
        width: 100% !important;
        display: flex !important;
        justify-content: center !important;
        flex-wrap: wrap !important;
        gap: 8px !important;
    }

    /* 显示底部导航栏 */
    .mobile-bottom-nav {
        display: flex !important;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 64px;
        background: var(--color-bg);
        border-top: 1px solid var(--color-border);
        box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
        z-index: 10000;
        justify-content: space-around;
        align-items: center;
        padding: 0 8px;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        /* 确保内容不被遮挡 */
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
    }

    /* 深色模式底部导航 */
    [data-theme="dark"] .mobile-bottom-nav {
        background: #1a1230;
        border-top-color: var(--color-border);
        box-shadow: 0 -2px 12px rgba(0,0,0,0.3);
    }

    /* 导航项 - 6个选项卡适配 */
    .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        padding: 4px 6px;
        min-width: 44px;
        min-height: 44px;
        border: none;
        background: none;
        color: var(--color-muted);
        font-size: 9px;
        font-weight: 500;
        cursor: pointer;
        border-radius: var(--radius-md);
        transition: all var(--ease-base);
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        position: relative;
        flex: 1;
    }

    .nav-item:active {
        background: var(--color-bg-hover);
        transform: scale(0.95);
    }

    .nav-item.active {
        color: var(--color-primary);
    }

    .nav-item.active .nav-icon {
        transform: scale(1.15);
    }

    .nav-icon {
        font-size: 18px;
        line-height: 1;
        transition: transform var(--ease-base);
    }

    .nav-label {
        font-size: 9px;
        line-height: 1.1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
    }

    /* 为底部导航留出空间 */
    #app-root {
        padding-bottom: 80px !important;
    }

    /* 登录页不需要底部导航 */
    .login-container {
        padding-bottom: 24px !important;
    }
    .mobile-bottom-nav.nav-hidden {
        display: none !important;
    }

    /* 主题切换按钮：移动端左下角（底部导航栏上方） */
    .theme-fixed {
        top: auto !important;
        bottom: 70px !important;
        left: 16px !important;
        right: auto !important;
    }

    /* 返回顶部按钮调整到底部导航栏上方 */
    .back-to-top {
        bottom: 80px !important;
        right: 16px !important;
        z-index: 10001 !important;
    }

    /* 触摸优化：确保所有可点击元素有足够大小 */
    button, .btn, .card, .site-card, .loc-card, .canteen-card, .contact-card, .store-card, .filter-btn {
        min-height: 44px;
        min-width: 44px;
    }

    /* 卡片点击反馈 */
    .card:active, .site-card:active, .loc-card:active {
        transform: scale(0.98);
        transition: transform 0.1s ease;
    }

    /* 移动端保留页面顶部导航栏，调整样式 */
    .page-header, .faq-header, .contacts-header, .websites-header, .abbreviations-header {
        padding: 14px 16px !important;
        margin-bottom: 12px !important;
        border-radius: var(--radius-md) !important;
    }
    .page-header h2, .faq-header h2, .contacts-header h2, .websites-header h2, .abbreviations-header h2 {
        font-size: 17px !important;
    }
    .page-header p, .faq-header p, .contacts-header p, .websites-header p, .abbreviations-header p {
        font-size: 12px !important;
        margin-top: 4px !important;
    }
}

/* ===================================
   子菜单弹出层（信息/更多）| Sub Menu Overlay
   =================================== */
.sub-menu-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 10002;
    align-items: flex-end;
    justify-content: center;
}
.sub-menu-overlay.show {
    display: flex;
}
.sub-menu-panel {
    background: var(--color-bg);
    border-radius: 18px 18px 0 0;
    padding: 16px 0 24px;
    width: 100%;
    max-width: 420px;
    animation: subMenuIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
}
@keyframes subMenuIn {
    from { transform: translateY(100%); opacity: 0.7; }
    to   { transform: translateY(0);    opacity: 1; }
}
.sub-menu-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 24px 12px;
    font-size: 15px;
    font-weight: 600;
    color: var(--color-heading);
}
.sub-menu-close {
    background: none;
    border: none;
    font-size: 20px;
    color: var(--color-muted);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    transition: background var(--ease-fast);
}
.sub-menu-close:hover { background: var(--color-bg-hover); }
.sub-menu-item {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 14px 24px;
    border: none;
    background: none;
    color: var(--color-body);
    font-size: 15px;
    cursor: pointer;
    transition: background var(--ease-fast);
    -webkit-tap-highlight-color: transparent;
}
.sub-menu-item:active { background: var(--color-bg-hover); }
.sub-menu-icon { font-size: 22px; width: 32px; text-align: center; }
.sub-menu-label { font-weight: 500; }

/* 深色模式子菜单 */
[data-theme="dark"] .sub-menu-panel {
    background: #1a1230;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.5);
}
[data-theme="dark"] .sub-menu-item:active { background: #231a3d; }

/* 移动端返回首页按钮 */
.mobile-back-home {
    display: none;
}
@media (max-width: 768px) {
    .mobile-back-home {
        display: flex !important;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 12px 16px;
        border: none;
        border-bottom: 1px solid var(--color-border);
        background: var(--color-card);
        color: var(--color-primary);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        border-radius: 0;
        transition: background var(--ease-fast);
        -webkit-tap-highlight-color: transparent;
        box-sizing: border-box;
    }
    .mobile-back-home:active { background: var(--color-bg-hover); }
    .mobile-back-home .back-arrow { font-size: 18px; margin-right: 2px; }
}


@media print {
    .mobile-bottom-nav {
        display: none !important;
    }
}

        .search-wrapper { position: relative; max-width: 600px; margin: 0 auto; z-index: 50; isolation: isolate; }
        .search-input {
            width: 100%; padding: 12px 44px 12px 18px;
            border: 2px solid var(--color-border); border-radius: 24px;
            font-size: 15px; outline: none; transition: border-color var(--ease-fast), box-shadow var(--ease-fast);
            background: var(--color-bg);
        }

        .search-clear { display: none !important; }
        .search-dropdown {
            position: absolute; top: 100%; left: 0; right: 0;

        .search-highlight { color: var(--color-primary); font-weight: 700; }
        .search-no-result { padding: 40px 20px; text-align: center; color: var(--color-light); font-size: 14px; }
        .search-no-result .empty-icon { font-size: 44px; margin-bottom: 10px; opacity: 0.5; }

        .section-title { margin-bottom: 16px; }

<!-- ==================== 学校概况 ==================== -->
<div class="faq-group" data-cat="school">
<h3 data-i18n="faq_sec_school" style="color:#333;margin-bottom:15px;padding-bottom:10px;border-bottom:3px solid #667eea;">🏫 学校概况</h3>
<div style="display:flex;flex-direction:column;gap:10px;">

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_school_01_q" style="font-weight:bold;color:#333;cursor:pointer;">学校地址是什么？（快递、外卖地址如何填写？）</summary>
<p data-i18n="faq_school_01_a" style="color:#666;margin-top:10px;line-height:1.8;">
广东省深圳市龙岗区龙城街道龙翔大道2001号香港中文大学（深圳）xx门/xx书院。外卖只能送到各个门的外卖柜，快递可以送到每个书院快递柜（大件会放到上/下园快递中心）。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_school_02_q" style="font-weight:bold;color:#333;cursor:pointer;">如何从高铁站、机场、火车站等交通枢纽往返学校？</summary>
<p data-i18n="faq_school_02_a" style="color:#666;margin-top:10px;line-height:1.8;">
<strong>高铁站：</strong><br>
深圳北站 → 公交E7路/E27路直达「信息学院」站，或地铁5号线→14号线→16号线至大运中心站；<br>
深圳坪山站 → 地铁16号线直达大运中心站；<br>
深圳站（罗湖）→ 地铁1号线→3号线至大运站；<br>
福田站 → 地铁11号线→14号线→16号线至大运中心站，或公交E5路至「信息学院」站。<br><br>
<strong>机场：</strong><br>
深圳宝安国际机场 → A4路机场快线直达（票价35元，约45-60分钟），或地铁11号线→14号线→16号线约2小时（票价10元左右），打车约150-180元。<br><br>
<strong>迎新接站：</strong>报到期间（8月24-26日 9:00-20:00），学校在深圳火车站（罗湖）、深圳北站、深圳宝安国际机场设有接站点，请于8月15日前到迎新系统填写接站信息。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_school_03_q" style="font-weight:bold;color:#333;cursor:pointer;">学校周边交通情况如何？</summary>
<p data-i18n="faq_school_03_a" style="color:#666;margin-top:10px;line-height:1.8;">
学校大门分为：上园门（直通高速入口，无公交，主要打车出行）、下园老南门（出门有"信息学院"公交站）、下园新南门（步行约10分钟到达大运中心地铁站16号线）、下园东门（"港中大深圳校区"公交站）。校内还有"高峰专线407"路公交车可直达大运地铁站。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_school_04_q" style="font-weight:bold;color:#333;cursor:pointer;">学校构造如何？</summary>
<p data-i18n="faq_school_04_a" style="color:#666;margin-top:10px;line-height:1.8;">
学校分为上、中、下园三部分。<strong>下园</strong>主要是学生上课和课余活动场所，分布有教学楼、图书馆、科研楼、行政楼、操场、体育馆、超市、社康中心、快递中心等，逸夫书院是下园唯一书院。<strong>上园</strong>以书院（宿舍）为主，共有7个书院（学勤、思廷、祥波、道扬、厚含、第七书院、第八书院），也有7-11便利店、自习室、银行、社康、快递中心等。<strong>中园</strong>正在建设医学院和音乐学院，还有景色优美的神仙湖。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_school_05_q" style="font-weight:bold;color:#333;cursor:pointer;">学校教室是怎么分布的呢？</summary>
<p data-i18n="faq_school_05_a" style="color:#666;margin-top:10px;line-height:1.8;">
教室主要分布于学校东西走向中轴线一侧，有TA、TB、TC、TD四幢教学楼和TXA、TXB、TXC、TXD四栋教学综合大楼（Teaching Complex）。少部分课程也在道远楼、诚道楼、知新楼、志仁楼及行政楼开课，具体位置请查看【校园地图】。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_school_06_q" style="font-weight:bold;color:#333;cursor:pointer;">学校什么时候开学呢？</summary>
<p data-i18n="faq_school_06_a" style="color:#666;margin-top:10px;line-height:1.8;">
一般在8月底左右，具体报到安排收到录取通知书后，新生手册里会有详细说明。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_school_07_q" style="font-weight:bold;color:#333;cursor:pointer;">团员的团关系怎么转入港中深？</summary>
<p data-i18n="faq_school_07_a" style="color:#666;margin-top:10px;line-height:1.8;">
跟随录取通知书会有一本新生手册，里面会有详细内容。团关系转入香港中文大学（深圳）<strong>书院团支部</strong>。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_school_08_q" style="font-weight:bold;color:#333;cursor:pointer;">书院是什么样的存在？有什么用？和学院有什么区别？</summary>
<p data-i18n="faq_school_08_a" style="color:#666;margin-top:10px;line-height:1.8;">
书院主要负责同学们的生活，学院则负责同学们的学习。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_school_09_q" style="font-weight:bold;color:#333;cursor:pointer;">报到期间学校有接站服务吗？</summary>
<p data-i18n="faq_school_09_a" style="color:#666;margin-top:10px;line-height:1.8;">
报到期间（8月24-26日 9:00-20:00），学校在<strong>深圳火车站（罗湖）、深圳北站、深圳宝安国际机场</strong>设有新生接站点。请于8月15日前登录迎新系统填写接站信息登记。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_school_10_q" style="font-weight:bold;color:#333;cursor:pointer;">现场注册报到需要带哪些材料？</summary>
<p data-i18n="faq_school_10_a" style="color:#666;margin-top:10px;line-height:1.8;">
<strong>内地学生：</strong>录取通知书原件及复印件、身份证原件及彩色复印件2份。<br>
<strong>港澳台学生：</strong>录取通知书原件及复印件、港澳通行证/台湾通行证原件及复印件。<br>
<strong>国际学生：</strong>录取通知书原件及复印件、护照原件及复印件。<br>
具体要求以录取通知书附带的入学手册为准，建议提前准备好所有材料。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_school_11_q" style="font-weight:bold;color:#333;cursor:pointer;">户口迁入学校怎么办理？</summary>
<p data-i18n="faq_school_11_a" style="color:#666;margin-top:10px;line-height:1.8;">
<strong>可以迁入：</strong>广东省内户口迁至龙岗区派出所；省外户口迁至深圳市公安局龙岗分局。<br>
<strong>迁入方式：</strong>入学报到时将户口迁移证交至学校，统一办理。<br>
<strong>不需迁入：</strong>深圳户籍学生无需迁入；香港、澳门、台湾学生无需迁入。<br>
<strong>注意事项：</strong>户口迁移证有效期通常为30天，请务必在有效期内办理；迁入后如需迁出，需另行申请。具体流程以入学手册为准。
</p>
</details>

</div>
</div>

<!-- ==================== 学习相关 ==================== -->
<div class="faq-group" data-cat="study">
<h3 data-i18n="faq_sec_study" style="color:#333;margin-bottom:15px;padding-bottom:10px;border-bottom:3px solid #667eea;">📖 学习相关</h3>
<div style="display:flex;flex-direction:column;gap:10px;">

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_study_01_q" style="font-weight:bold;color:#333;cursor:pointer;">体育课有哪些？是自由选择的吗？</summary>
<p data-i18n="faq_study_01_a" style="color:#666;margin-top:10px;line-height:1.8;">
体育课可选种类非常丰富，除了常见的篮球、足球、羽毛球、乒乓球外，还有瑜伽、散打、高尔夫、攀岩、地壶、飞盘等项目。体育课可自由选择，但热门课程需要抢课。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_study_02_q" style="font-weight:bold;color:#333;cursor:pointer;">全英文教学我能适应吗？</summary>
<p data-i18n="faq_study_02_a" style="color:#666;margin-top:10px;line-height:1.8;">
建议大家上课前浏览老师在Blackboard（简称BB）上上传的课程内容，做好预习，查一下专有名词的解释。教授们对大一新生会讲得慢一些，足够让大家适应。下课后如有疑惑一定要大胆询问老师（也可以在老师的Office Hour约时间答疑）。如果是中国老师可以用中文提问，外国老师则需英语交流，但这也是练习口语和听力的好机会。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_study_03_q" style="font-weight:bold;color:#333;cursor:pointer;">什么时候选专业呢？</summary>
<p data-i18n="faq_study_03_a" style="color:#666;margin-top:10px;line-height:1.8;">
理科实验班的同学，在开学前会让大家选定学院。所有同学会在大一下学期（5月份左右）在学院内选专业。选专业前会有各类讲座为大家答疑解惑，可根据自己的情况酌情选择。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_study_04_q" style="font-weight:bold;color:#333;cursor:pointer;">如何迅速适应学校的学习生活？</summary>
<p data-i18n="faq_study_04_a" style="color:#666;margin-top:10px;line-height:1.8;">
不要抱着"大学就是放松"的想法开始大学生活。在港中深没有班级的概念，需要自己做学习上的主人，主动安排学习任务，多与同学、教授和学长学姐交流。<strong>时刻关注自己的学校邮箱！</strong>每个人都会被分配一个edu邮箱，这是大学四年里所有课程信息、学校通知、活动通知的阵地，一定要养成勤看邮件的习惯！
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_study_05_q" style="font-weight:bold;color:#333;cursor:pointer;">需不需要买纸质课本呢？</summary>
<p data-i18n="faq_study_05_a" style="color:#666;margin-top:10px;line-height:1.8;">
电子版和纸质版完全依个人需求而定，正常情况电子书已能满足大部分应用。如果不适应用电子书可以买纸质书，但部分课程会因老师更换而改变教材，买二手教材时要慎重。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_study_06_q" style="font-weight:bold;color:#333;cursor:pointer;">选课应该怎么选呢？</summary>
<p data-i18n="faq_study_06_a" style="color:#666;margin-top:10px;line-height:1.8;">
大一第一学期的课程学校基本给大家安排好了：理工、数据科学、人文和医学院只需抢体育、语文/思政；经管学院抢体育、语文/思政和数学课（MAT1001或MAT1005，其中1001更难，1005较简单，但仅未来想选会计或市场营销专业的同学学1005，其他专业建议学1001）。对数学有信心的同学都可以申请MAT1011，比1001更难，但对数学专业同学有帮助且给分更好。入学时会有老师和学长学姐教大家操作选课系统。各专业的课程要求可参考<a href="https://registry.cuhk.edu.cn/" target="_blank" style="color:#667eea;">教务处官网</a>。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_study_07_q" style="font-weight:bold;color:#333;cursor:pointer;">体育课是怎么打分的呢？要算入GPA吗？</summary>
<p data-i18n="faq_study_07_a" style="color:#666;margin-top:10px;line-height:1.8;">
体育课分为笔试、技术考试和体测，体测成绩仅占5%，主要以笔试和技术考试为主。技术考试即考所选体育课的内容，老师有自己的打分标准（建议选自己擅长的项目）。体育成绩算入GPA，但仅1学分，加权平均后对总GPA的影响不是特别大。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_study_08_q" style="font-weight:bold;color:#333;cursor:pointer;">如何评价金融工程专业？</summary>
<p data-i18n="faq_study_08_a" style="color:#666;margin-top:10px;line-height:1.8;">
金融工程专业是一门交叉学科，是目前比较前沿、比较火的方向之一，结合了金融、数学和计算机的知识。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_study_09_q" style="font-weight:bold;color:#333;cursor:pointer;">大一想跟教授做课题，是直接发邮件问吗？有什么建议？</summary>
<p data-i18n="faq_study_09_a" style="color:#666;margin-top:10px;line-height:1.8;">
有些教授会通过多方渠道招募RA（Research Assistant），可以通过这个渠道跟项目组产生联系。如果有感兴趣的领域，可以大胆给教授发邮件表达加入意向，机会都是争取来的。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_study_10_q" style="font-weight:bold;color:#333;cursor:pointer;">学校的暑课项目平均收费多少？需要雅思或托福成绩吗？</summary>
<p data-i18n="faq_study_10_a" style="color:#666;margin-top:10px;line-height:1.8;">
本校上暑课前6学分不收费，如果暑课交换到其他校区则会收费，具体视项目要求而定。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_study_11_q" style="font-weight:bold;color:#333;cursor:pointer;">学校有什么交换生或暑期项目可以申请？对GPA有要求吗？</summary>
<p data-i18n="faq_study_11_a" style="color:#666;margin-top:10px;line-height:1.8;">
OAL（教务处）在暑期开始前会发送相关邮件，里面收录了本学期所有合作院校与项目以及报名链接，有些项目会对GPA有要求。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_study_12_q" style="font-weight:bold;color:#333;cursor:pointer;">学校的GPA是怎么算的？满分是多少？</summary>
<p data-i18n="faq_study_12_a" style="color:#666;margin-top:10px;line-height:1.8;">
绩点按等级比例计算，满绩为4.0。对应规则为：A=4.0，A-=3.7，B+=3.3，B=3.0，B-=2.7，以此类推。具体计算方式详见教务处官网文件。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_study_13_q" style="font-weight:bold;color:#333;cursor:pointer;">入学后想转专业，有什么要求？难度大吗？</summary>
<p data-i18n="faq_study_13_a" style="color:#666;margin-top:10px;line-height:1.8;">
学校对于转专业非常自由，具体要求和流程可联系教务处咨询，联系方式见【常用联系方式】。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_study_14_q" style="font-weight:bold;color:#333;cursor:pointer;">学校对英语水平有要求吗？有英语分级考试吗？</summary>
<p data-i18n="faq_study_14_a" style="color:#666;margin-top:10px;line-height:1.8;">
学校绝大部分课程为全英文授课；入学无英语分级考试；不强制要求考四六级。入学时若雅思总分大于6.5可豁免ENG1001，大于7.5（且小分大于7.0）可豁免ENG1001和ENG1002。其他语言考试豁免英语课要求详见教务处文件，见【常用网站及小程序 - 教务处】。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_study_15_q" style="font-weight:bold;color:#333;cursor:pointer;">每天有"早八"吗？上课时间是怎么安排的？</summary>
<p data-i18n="faq_study_15_a" style="color:#666;margin-top:10px;line-height:1.8;">
学校第一节课时间为8:30，但课程时段由学生自己选择，不想上"早八"可以不选。
</p>
</details>

</div>
</div>

<!-- ==================== 生活相关 ==================== -->
<div class="faq-group" data-cat="life">
<h3 data-i18n="faq_sec_life" style="color:#333;margin-bottom:15px;padding-bottom:10px;border-bottom:3px solid #667eea;">🏠 生活相关</h3>
<div style="display:flex;flex-direction:column;gap:10px;">

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_01_q" style="font-weight:bold;color:#333;cursor:pointer;">书院是随机分的吗？可以自选宿舍吗？可以换宿舍吗？</summary>
<p data-i18n="faq_life_01_a" style="color:#666;margin-top:10px;line-height:1.8;">
书院和宿舍都是随机分配的，如无特殊情况，可以在一学年结束时提出换宿舍申请。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_02_q" style="font-weight:bold;color:#333;cursor:pointer;">床的长宽是多少？</summary>
<p data-i18n="faq_life_02_a" style="color:#666;margin-top:10px;line-height:1.8;">
不同书院有差别，床垫的话书院也会提供（二手但清洁）的床垫，具体可以等分好宿舍和书院后再做安排。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_03_q" style="font-weight:bold;color:#333;cursor:pointer;">学校有多少个食堂，味道如何？价格如何？</summary>
<p data-i18n="faq_life_03_a" style="color:#666;margin-top:10px;line-height:1.8;">
学校下园有4个食堂：学生活动中心一楼、二楼、逸夫书院的逸帆风顺、会议楼餐厅；上园在祥波书院、思廷书院、学勤书院、厚含书院也有食堂。学勤书院食堂里有麦当劳和乐凯撒。思廷书院有烧腊、云吞等正餐以及夜宵（到晚上11:30，有时12点后也有）。详见【校园地图】和【常用设施及服务】。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_04_q" style="font-weight:bold;color:#333;cursor:pointer;">宿舍和舍友是自己选的吗？</summary>
<p data-i18n="faq_life_04_a" style="color:#666;margin-top:10px;line-height:1.8;">
宿舍是随机分配的。但开学前会让大家填写作息规律和空调敏感度等问卷，按照大家相似的生活习惯进行分配。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_05_q" style="font-weight:bold;color:#333;cursor:pointer;">学校里有打印店吗（最好可以彩印的）？</summary>
<p data-i18n="faq_life_05_a" style="color:#666;margin-top:10px;line-height:1.8;">
学校里随处可见自助打印机，可以黑白也可以彩色打印，黑白0.1元/页，彩色0.85元/页。可将文件上传至云打印平台，然后在打印机处微信扫码登录打印（具体使用方法可以咨询学长学姐或ITSO）。同时学校下园也有打印店可以打印或制作海报等，下沉广场也有通条文印提供打印服务。详见【常用设施及服务】。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_06_q" style="font-weight:bold;color:#333;cursor:pointer;">学校外卖、快递相关问题？</summary>
<p data-i18n="faq_life_06_a" style="color:#666;margin-top:10px;line-height:1.8;">
<strong>外卖：</strong>学校周围外卖种类繁多，可以送到下园老南门/新南门，上园北门/祥波门，有智能外卖柜，扫码输入手机号后四位取餐。也可以加入各种外卖凑单群，午餐晚餐时间会有一些店家统一为学校配送。<br><br>
<strong>快递：</strong>学校上园和下园均有大量丰巢快递柜以及收发室（顺丰速运负责运营）。小件快递会被放入丰巢，大件会被送到收发室保管。学校的丰巢无论存柜多久均无任何存柜费，免费使用。同时丰巢和收发室也有寄件功能，顺丰快递还可以上门取件。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_07_q" style="font-weight:bold;color:#333;cursor:pointer;">宿舍可以养（进）猫猫吗？有军训吗？有体测吗？</summary>
<p data-i18n="faq_life_07_a" style="color:#666;margin-top:10px;line-height:1.8;">
宿舍不可以养宠物！不过如果喜欢撸猫的话上园有很多只猫，每一只都有自己的名字，可以关注港中深动物保护协会了解学校里的猫猫们！<br><br>
按照以往经验，<strong>无军训，有体测</strong>。体测大概在10-11月份，标准遵循教育部制定的大学生体测标准。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_08_q" style="font-weight:bold;color:#333;cursor:pointer;">学校录取通知书会发银行卡，手机卡什么的吗？</summary>
<p data-i18n="faq_life_08_a" style="color:#666;margin-top:10px;line-height:1.8;">
银行卡是有的，中信银行。学校免费WiFi全覆盖，手机卡可以自己去营业厅办。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_09_q" style="font-weight:bold;color:#333;cursor:pointer;">快递费贵么？可以用快递100批量发货吗？</summary>
<p data-i18n="faq_life_09_a" style="color:#666;margin-top:10px;line-height:1.8;">
正常价格，与市面差别不大。学校有快递服务中心，丰巢也可以寄快递。具体价格视快递公司而定。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_10_q" style="font-weight:bold;color:#333;cursor:pointer;">宿舍条件如何？几人间？有空调和独立卫浴吗？</summary>
<p data-i18n="faq_life_10_a" style="color:#666;margin-top:10px;line-height:1.8;">
所有本科生宿舍都是四人间，大部分是上床下桌，也会为身高超过一米九的同学提供加长床；有空调；每一层有公共卫浴，淋浴间干湿分离，会有专业的物业团队提供清洁服务；每一层还有公共厨房，里面会提供冰箱、微波炉、空气炸锅、咖啡机、电灶等（具体设施以各书院实际情况为准）；每一栋的最顶层是洗衣房，里面有大量洗衣机和烘干机；每个书院还会有健身房、自习室、台球室、电视房、冥想室等各种功能房供宿生使用（具体设施以各书院实际情况为准）。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_11_q" style="font-weight:bold;color:#333;cursor:pointer;">校园卡有什么用？怎么充值？失卡了怎么办？</summary>
<p data-i18n="faq_life_11_a" style="color:#666;margin-top:10px;line-height:1.8;">
校园卡可用于场地预约与验证（如图书馆研讨室开门）、校门进出（如忘带需在企微上出示电子校园卡给安保人员协助开门）、重要考试时验证身份（如未携带需签字，后续需前往相关部门重新验证）、食堂支付（但一般都直接用微信或支付宝，所以不建议向校园卡内充值）；丢失后可前往下沉广场中信银行网点内的校园卡中心补办【详见校园地图】。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_12_q" style="font-weight:bold;color:#333;cursor:pointer;">学校的WiFi怎么连？网速快吗？</summary>
<p data-i18n="faq_life_12_a" style="color:#666;margin-top:10px;line-height:1.8;">
学校有免费WiFi，输入CUHK(SZ)账密后可免费连接；网速在正常情况下可以满足日常使用；宿舍内也提供有线网络接口。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_14_q" style="font-weight:bold;color:#333;cursor:pointer;">校内可以骑电动车或自行车吗？有没有共享电动车？需不需要上牌？</summary>
<p data-i18n="faq_life_14_a" style="color:#666;margin-top:10px;line-height:1.8;">
为了师生安全，学校采取较严格的交通管制措施。自2025年起不再颁发电瓶车牌，可以骑自行车；校内没有共享自行车，但会有免费校巴供师生代步。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_15_q" style="font-weight:bold;color:#333;cursor:pointer;">学校有哪些奖学金或助学金可以申请？家庭经济困难有什么支持吗？</summary>
<p data-i18n="faq_life_15_a" style="color:#666;margin-top:10px;line-height:1.8;">
奖助学金详情可以咨询OSA（学生事务处），OSA联系方式见【常用联系方式】。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_16_q" style="font-weight:bold;color:#333;cursor:pointer;">生病了去哪里看病？社康中心在哪里？医保怎么用？</summary>
<p data-i18n="faq_life_16_a" style="color:#666;margin-top:10px;line-height:1.8;">
上园和下园都设有社康中心，就诊前可在"社康通"小程序中预约并出示社保码，详见【常用网站及小程序 - 常用小程序 - 社康通】。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_17_q" style="font-weight:bold;color:#333;cursor:pointer;">学校有心理辅导或心理咨询服务吗？怎么预约？</summary>
<p data-i18n="faq_life_17_a" style="color:#666;margin-top:10px;line-height:1.8;">
学校设有学生健康辅导中心（SHCC），联系方式见【常用联系方式 - 行政部门 - SHCC】。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_18_q" style="font-weight:bold;color:#333;cursor:pointer;">图书馆怎么样？怎么预约研讨室？怎么借书？</summary>
<p data-i18n="faq_life_18_a" style="color:#666;margin-top:10px;line-height:1.8;">
图书馆提供多样化的自习和讨论环境，以及丰富的线上线下资源；研讨室需在企业微信 - 工作台 - 场地预约中预约；借书可在图书馆网站中查阅并申请借阅，详见【常用网站及小程序】。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_20_q" style="font-weight:bold;color:#333;cursor:pointer;">学校有校巴吗？有哪些线路？</summary>
<p data-i18n="faq_life_20_a" style="color:#666;margin-top:10px;line-height:1.8;">
学校共有一号线、二号线、三号线（高峰线）、四号线和音乐学院线等校内巴士，以及若干校外穿梭巴士。具体线路和运营时间可见【常用网站及小程序 - 智行港中深】。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_21_q" style="font-weight:bold;color:#333;cursor:pointer;">入学需要带哪些行李物品？学校可以买生活用品吗？</summary>
<p data-i18n="faq_life_21_a" style="color:#666;margin-top:10px;line-height:1.8;">
生活物品看个人所需。学校上园和下园有全家、罗森、天猫便利店可以购买物资；每个书院也配有丰巢快递柜，网购很方便。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_22_q" style="font-weight:bold;color:#333;cursor:pointer;">学校有哪些运动场馆？需要预约吗？</summary>
<p data-i18n="faq_life_22_a" style="color:#666;margin-top:10px;line-height:1.8;">
游泳池位于大学体育馆（详见【校园地图】），刷学生卡可直接进入，无需预约。大学体育馆一楼设有健身馆，部分书院内也配有较小的健身房。羽毛球场、匹克球场、乒乓球场位于综合体育馆，其中羽毛球场需在企业微信 - 工作台 - 场地预约中预约。室内篮球场位于大学体育馆，室外篮球场位置详见【校园地图】。此外还有各类运动设施分布在大学体育馆和综合体育馆，等待同学们探索。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_23_q" style="font-weight:bold;color:#333;cursor:pointer;">书院自习室是24小时的吗？图书馆考试周开放到几点？</summary>
<p data-i18n="faq_life_23_a" style="color:#666;margin-top:10px;line-height:1.8;">
各书院的自习室为24小时开放；考试周期间图书馆开放至深夜12点。图书馆内设有公共电脑区域，配有显示屏供使用。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_24_q" style="font-weight:bold;color:#333;cursor:pointer;">社康中心能看哪些病？能不能开病假条？</summary>
<p data-i18n="faq_life_24_a" style="color:#666;margin-top:10px;line-height:1.8;">
社康中心有全科医师坐诊，可以开具医疗证明；但大病或严重症状建议直接前往附近大医院就诊。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_life_25_q" style="font-weight:bold;color:#333;cursor:pointer;">个人档案（学生档案）怎么转递到学校？</summary>
<p data-i18n="faq_life_25_a" style="color:#666;margin-top:10px;line-height:1.8;">
<strong>内地学生：</strong>档案可通过以下方式转递：<br>
① 自带：凭录取通知书到原档案存放单位领取，入学报到时交至学校；<br>
② EMS邮寄：由档案存放单位通过EMS直接邮寄至学校（邮寄地址：广东省深圳市龙岗区龙翔大道2001号香港中文大学（深圳）学生事务处，电话0755-84273118）。<br>
<strong>港澳台及国际学生：</strong>无需转递内地个人档案。<br>
⚠️ 档案不可拆封！拆封后档案将失效。
</p>
</details>

</div>
</div>

<!-- ==================== 娱乐相关 ==================== -->
<div class="faq-group" data-cat="fun">
<h3 data-i18n="faq_sec_fun" style="color:#333;margin-bottom:15px;padding-bottom:10px;border-bottom:3px solid #667eea;">🎯 娱乐相关</h3>
<div style="display:flex;flex-direction:column;gap:10px;">

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_fun_01_q" style="font-weight:bold;color:#333;cursor:pointer;">学校附近有什么商场或休闲娱乐场所？</summary>
<p data-i18n="faq_fun_01_a" style="color:#666;margin-top:10px;line-height:1.8;">
离学校最近的商场是大运天地，稍远一点还有龙岗星河COCO Park，COCO Park里有海底捞等各类饭店，有电影院，还有山姆会员超市。同时学校周围还有万科广场、万科里等，基本可满足日常逛街、外出吃饭、看电影等需求。学校附近还有大运自然公园等休闲娱乐场所。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_fun_02_q" style="font-weight:bold;color:#333;cursor:pointer;">校乐团非音乐学院学生可以参加吗？要怎样考核呢？</summary>
<p data-i18n="faq_fun_02_a" style="color:#666;margin-top:10px;line-height:1.8;">
学校艺术团体分为三大团：校合唱团、管弦乐团和民乐团。全校全体师生都可以通过报名→考核的流程加入艺术团体。<br><br>
<strong>合唱团</strong>的考核包括：清唱自选歌曲片段 + 现场视唱（可自选五线谱/简谱）+ 音域测试。通过考核的成员会收到邮件通知并告知所在声部（女高/女低/男高/男低）。合唱团每周排练两次，会参加学校年度音乐会演出以及合唱团专场演出。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_fun_03_q" style="font-weight:bold;color:#333;cursor:pointer;">社团管理层或是学生会干部在日后国外offer申请时有帮助吗？</summary>
<p data-i18n="faq_fun_03_a" style="color:#666;margin-top:10px;line-height:1.8;">
申请是一件很综合的事，可以说你在学校做的所有事都可能对申请有影响。除了目标学校官网公布的申请条件，没有什么是一定必要或不必要的。经历丰富一点可能会让审核人员看到你的多元化和发展潜力。
</p>
</details>

<details style="padding:15px;border:1px solid #e0e0e0;border-radius:10px;cursor:pointer;">
<summary data-i18n="faq_fun_04_q" style="font-weight:bold;color:#333;cursor:pointer;">新生舞会是必须参加吗？</summary>
<p data-i18n="faq_fun_04_a" style="color:#666;margin-top:10px;line-height:1.8;">
不是，完全自愿！新生舞会是学校传统的迎新活动之一，可以认识新朋友、体验社交舞，有兴趣的同学可以参加。
</p>
</details>

</div>
</div>

        <!-- 校园地图 -->
        <div class="guide-section">
            <div class="guide-section-header">
                <div class="guide-section-icon">🗺️</div>
                <div>
                    <div class="guide-section-title" data-i18n="card_campus_map">校园地图</div>
                    <div class="guide-section-subtitle" data-i18n="guide_map_subtitle">交互式校园导览图</div>
                </div>
            </div>
            <div class="guide-section-body">
                <p data-i18n="guide_map_p1">提供香港中文大学（深圳）高清交互式校园地图，点击地图上的标记点可查看地点名称与简介。</p>
                <p><strong data-i18n="guide_map_features">主要功能：</strong></p>
                <ul>
                    <li data-i18n="guide_map_feat1">🔍 <strong>搜索功能</strong>：输入地点名称或关键词（如"图书馆"、"麦当劳"）快速定位</li>
                    <li data-i18n="guide_map_feat2">📂 <strong>分类筛选</strong>：按校门、教学楼、书院、图书馆、设施、体育、生活等分类快速过滤</li>
                    <li data-i18n="guide_map_feat3">🖱️ <strong>缩放平移</strong>：鼠标滚轮/双指缩放，拖拽平移地图</li>
                    <li data-i18n="guide_map_feat4">📍 <strong>卡片联动</strong>：点击下方地点卡片可自动定位到地图对应位置</li>
                    <li data-i18n="guide_map_feat5">⛶ <strong>全屏模式</strong>：点击全屏按钮获得更大视野</li>
