           'faq_school_01_a': { zh: '广东省深圳市龙岗区龙城街道龙翔大道2001号香港中文大学（深圳）xx门/xx书院。外卖只能送到各个门的外卖柜，快递可以送到每个书院快递柜（大件会放到上/下园快递中心）。', en: 'No. 2001 Longxiang Avenue, Longcheng Street, Longgang District, Shenzhen, Guangdong, China Hong Kong University of Shenzhen (XX Gate/XX College). Takeout can only be delivered to takeout cabinets at each gate. Express delivery can be sent to each college\'s express locker (large items will be placed at the Upper/Lower Campus express center).' },
           'faq_school_02_q': { zh: '如何从高铁站、机场、火车站等交通枢纽往返学校？', en: 'How to get to/from the school from rail stations, airports, and train stations?' },
           'faq_school_02_a': { zh: '高铁站：深圳北站 → 公交E7/E27路直达「信息学院」站，或地铁5号线→14号线→16号线至大运中心站；深圳坪山站 → 地铁16号线直达大运中心站；深圳站（罗湖）→ 地铁1号线→3号线至大运站；福田站 → 地铁11号线→14号线→16号线至大运中心站，或公交E5路至「信息学院」站。机场：深圳宝安国际机场 → A4路机场快线直达（票价35元，约45-60分钟），或地铁11号线→14号线→16号线约2小时（票价10元左右），打车约150-180元。迎新接站：报到期间（8月24-26日 9:00-20:00），学校在深圳火车站（罗湖）、深圳北站、深圳宝安国际机场设有接站点，请于8月15日前到迎新系统填写接站信息。', en: 'High-speed rail: Shenzhen North Station → Bus E7/E27 to "Info Institute" stop, or Metro Line 5→14→16 to Dayun Center Station. Pingshan Station → Metro Line 16 directly to Dayun Center. Shenzhen Station (Luohu) → Metro Line 1→3 to Dayun Station. Futian Station → Metro Line 11→14→16 to Dayun Center, or Bus E5 to "Info Institute". Airport: Shenzhen Bao\'an Airport → Airport Express A4 direct (35 RMB, ~45-60 min), or Metro Line 11→14→16 (~2 hours, ~10 RMB), taxi ~150-180 RMB. Orientation pickup: During registration period (Aug 24-26, 9:00-20:00), the school provides pickup at Shenzhen Station (Luohu), Shenzhen North Station, and Shenzhen Bao\'an Airport. Please fill in pickup info on the Orientation System before Aug 15.' },
           'faq_school_03_q': { zh: '学校周边交通情况如何？', en: 'What is the transportation situation around the school?' },
           'faq_school_03_a': { zh: '学校大门分为：上园门（直通高速入口，无公交，主要打车出行）、下园老南门（出门有"信息学院"公交站）、下园新南门（步行约10分钟到达大运中心地铁站16号线）、下园东门（"港中大深圳校区"公交站）。校内还有"高峰专线407"路公交车可直达大运地铁站。', en: 'School gates: Upper Campus Gate (direct highway access, no bus, mainly taxi). Lower Campus Old South Gate (has "Info Institute" bus stop). Lower Campus New South Gate (~10 min walk to Dayun Center Metro Station Line 16). Lower Campus East Gate ("CUHK-Shenzhen Campus" bus stop). There is also Peak Route 407 bus within the school that goes directly to Dayun Metro Station.' },
           'faq_school_04_q': { zh: '学校构造如何？', en: 'What is the layout of the school campus?' },
           'faq_school_04_a': { zh: '学校分为上、中、下园三部分。下园主要是学生上课和课余活动场所，分布有教学楼、图书馆、科研楼、行政楼、操场、体育馆、超市、社康中心、快递中心等，逸夫书院是下园唯一书院。上园以书院（宿舍）为主，共有7个书院，也有罗森便利店、自习室、银行、社康、快递中心等。中园正在建设医学院，有第八书院和音乐学院，还有景色优美的神仙湖。', en: 'The school has three parts: Upper, Middle, and Lower Campus. Lower Campus is mainly for classes and activities, with teaching buildings, library, research buildings, admin building, sports field, gym, supermarket, clinic, delivery center, etc. Sir Run Run Shaw College is the only college in Lower Campus. Upper Campus is mainly colleges (dormitories) with 7 colleges, Lawson convenience store, study rooms, bank, clinic, delivery center, etc. Middle Campus is under construction for the Medical School, with the 8th College and Music School, and has the beautiful Fairy Lake.' },
           'faq_school_05_q': { zh: '学校教室是怎么分布的呢？', en: 'How are the classrooms distributed on campus?' },
           'faq_school_05_a': { zh: '教室主要分布于学校东西走向中轴线的一侧，有TA、TB、TC、TD四幢教学楼和TXA、TXB、TXC、TXD四栋教学综合大楼（Teaching Complex）。少部分课程也在道远楼、诚道楼、知新楼、志仁楼及行政楼开课，具体位置请看【校园地图】。', en: 'Classrooms are mainly distributed along the east-west central axis of the campus, including four teaching buildings TA, TB, TC, TD and four teaching complex buildings TXA, TXB, TXC, TXD. A small number of courses are also held in Daoyuan Building, Chengdao Building, Zhixin Building, Zhiren Building and the Admin Building. Please refer to the [Campus Map] for specific locations.' },
           'faq_school_06_q': { zh: '学校什么时候开学呢？', en: 'When does the school start in the fall?' },
           'faq_school_06_a': { zh: '一般在8月底左右，具体报到安排收到录取通知书后，新生手册里会有详细说明。', en: 'Generally around late August. Specific registration arrangements will be detailed in the freshman handbook that comes with the admission letter.' },
           'faq_school_07_q': { zh: '团员的团关系怎么转入港中深？', en: 'How do League members transfer their League relationship to CUHK-Shenzhen?' },
           'faq_school_07_a': { zh: '跟随录取通知书会有一本新生手册，里面会有详细内容。团关系转入香港中文大学（深圳）**书院团支部。', en: 'The freshman handbook that comes with the admission letter contains detailed information. The League relationship is transferred to the College Youth League Branch of CUHK-Shenzhen.' },
           'faq_school_08_q': { zh: '书院是什么样的存在？有什么用？和学院有什么区别？', en: 'What is a college? What is it for? How is it different from a school/faculty?' },
           'faq_school_08_a': { zh: '书院主要负责同学们的生活，学院则负责同学们的学习。', en: 'Colleges are mainly responsible for students\' daily life, while schools/faculties are responsible for students\' academic learning.' },
           'faq_school_09_q': { zh: '报到期间学校有接站服务吗？', en: 'Does the school provide pickup service during registration?' },
           'faq_school_09_a': { zh: '报到期间（8月24-26日 9:00-20:00），学校在深圳火车站（罗湖）、深圳北站、深圳宝安国际机场设有新生接站点。请于8月15日前登录迎新系统填写接站信息登记。', en: 'During registration (Aug 24-26, 9:00-20:00), the school provides pickup at Shenzhen Station (Luohu), Shenzhen North Station, and Shenzhen Bao\'an Airport. Please fill in pickup info on the Orientation System before Aug 15.' },
           'faq_school_10_q': { zh: '现场注册报到需要带哪些材料？', en: 'What documents do I need for on-site registration?' },
           'faq_school_10_a': { zh: '内地学生：录取通知书原件及复印件、身份证原件及彩色复印件2份。港澳台学生：录取通知书原件及复印件、港澳通行证/台湾通行证原件及复印件。国际学生：录取通知书原件及复印件、护照原件及复印件。具体要求以录取通知书附带的入学手册为准，建议提前准备好所有材料。', en: 'Mainland students: Original + copy of admission letter, original + 2 colour copies of ID card. HK/Macao/Taiwan students: Original + copy of admission letter, original + copy of HK/Macao/Taiwan travel permit. International students: Original + copy of admission letter, original + copy of passport. Specific requirements are in the enrollment handbook enclosed with the admission letter – prepare all documents in advance.' },
           'faq_school_11_q': { zh: '户口迁入学校怎么办理？', en: 'How do I transfer my household registration (hukou) to the school?' },
           'faq_school_11_a': { zh: '可以迁入：广东省内户口迁至龙岗区派出所；省外户口迁至深圳市公安局龙岗分局。迁入方式：入学报到时将户口迁移证交至学校，统一办理。不需迁入：深圳户籍学生无需迁入；香港、澳门、台湾学生无需迁入。注意事项：户口迁移证有效期通常为30天，请务必在有效期内办理；迁入后如需迁出，需另行申请。具体流程以入学手册为准。', en: 'Transferable: Guangdong residents transfer to Longgang Police Station; out-of-province residents transfer to Longgang Branch of Shenzhen PSB. Method: Submit the hukou transfer certificate during registration; the school will process it collectively. No transfer needed: Shenzhen residents; HK, Macao & Taiwan students. Note: The hukou transfer certificate is valid for 30 days – process it within the validity period. To transfer out later, you must apply separately. Follow the enrollment handbook for details.' },
           'faq_study_01_q': { zh: '体育课有哪些？是自由选择的吗？', en: 'What PE courses are available? Are they free to choose?' },
           'faq_study_01_a': { zh: '体育课可选种类非常丰富，除了常见的篮球、足球、羽毛球、乒乓球外，还有瑜伽、散打、高尔夫、攀岩、地壶、飞盘等项目。体育课可自由选择，但热门课程需要抢课。', en: 'PE courses are very diverse, including basketball, football, badminton, table tennis, as well as yoga, sanda, golf, rock climbing, floor curling, frisbee, etc. You can freely choose, but popular courses require course selection (snatching).' },
           'faq_study_02_q': { zh: '全英文教学我能适应吗？', en: 'Can I adapt to all-English teaching?' },
           'faq_study_02_a': { zh: '建议大家上课前浏览老师在Blackboard（简称BB）上上传的课程内容，做好预习，查一下专有名词的解释。教授们对大一新生会讲得慢一些，足够让大家适应。下课后如有疑惑一定要大胆询问老师（也可以在老师的Office Hour约时间答疑）。如果是中国老师可以用中文提问，外国老师则需英语交流，但这也是练习口语和听力的好机会。', en: 'It is recommended to browse the course content uploaded by teachers on Blackboard (BB) before class, preview well, and look up explanations of technical terms. Professors will speak slower for freshmen, which is enough for everyone to adapt. If you have doubts after class, be bold and ask the teacher (you can also make an appointment during the teacher\'s Office Hour). If it is a Chinese teacher, you can ask in Chinese; if it is a foreign teacher, you need to communicate in English, but this is also a good opportunity to practice speaking and listening.' },
           'faq_study_03_q': { zh: '什么时候选专业呢？', en: 'When do we choose our major?' },
           'faq_study_03_a': { zh: '理科实验班的同学，在开学前会让大家选定学院。所有同学会在大一下学期（5月份左右）在学院内选专业。选专业前会有各类讲座为大家答疑解惑，可根据自己的情况酌情选择。', en: 'For students in the Science Experimental Class, everyone will select their school before the start of the semester. All students will choose their major within their school in the second semester of freshman year (around May). Before major selection, there will be various lectures to answer questions, and you can choose according to your own situation.' },
           'faq_study_04_q': { zh: '如何迅速适应学校的学习生活？', en: 'How to quickly adapt to the school\'s learning and living?' },
           'faq_study_04_a': { zh: '不要抱着"大学就是放松"的想法开始大学生活。在港中深没有班级的概念，需要自己做学习上的主人，主动安排学习任务，多与同学、教授和学长学姐交流。时刻关注自己的学校邮箱！每个人都会被分配一个edu邮箱，这是大学四年里所有课程信息、学校通知、活动通知的阵地，一定要养成勤看邮件的习惯！', en: 'Don\'t start your college life with the idea that "college is for relaxing." At CUHK-Shenzhen, there is no concept of classes, so you need to be the master of your own learning, actively arrange learning tasks, and communicate more with classmates, professors, and seniors. Always pay attention to your school email! Everyone is assigned an edu email, which is the platform for all course information, school notices, and activity notices during your four years of college. You must develop the habit of checking emails frequently!' },
           'faq_study_05_q': { zh: '需不需要买纸质课本呢？', en: 'Do I need to buy physical textbooks?' },
           'faq_study_05_a': { zh: '电子版和纸质版完全依个人需求而定，正常情况电子书已能满足大部分应用。如果不适应用电子书可以买纸质书，但部分课程会因老师更换而改变教材，买二手教材时要慎重。', en: 'Electronic versions and physical versions are completely up to personal needs. Under normal circumstances, e-books can already meet most needs. If you don\'t adapt well to e-books, you can buy physical books, but some courses may change textbooks due to teacher changes, so be cautious when buying second-hand textbooks.' },
           'faq_study_06_q': { zh: '选课应该怎么选呢？', en: 'How should I select courses?' },
           'faq_study_06_a': { zh: '大一第一学期的课程学校基本给大家安排好了：理工、数据科学、人文和医学院只需抢体育、语文/思政；经管学院抢体育、语文/思政和数学课（MAT1001或MAT1005，其中1001更难，1005较简单，但仅未来想选会计或市场营销专业的同学学1005，其他专业建议学1001）。对数学有信心的同学都可以申请MAT1011荣誉课程，比1001更难，但对数学专业同学有帮助。入学时会发邮件且有老师和学长学姐教大家操作选课系统。各专业的课程要求可参考教务处官网。', en: 'The school basically arranges courses for everyone in the first semester of freshman year: Science, Data Science, Humanities and Medical schools only need to snatch PE, Chinese/Political courses; Economics and Management school snatches PE, Chinese/Political and Math courses (MAT1001 or MAT1005, where 1001 is harder and 1005 easier, but only students planning to major in Accounting or Marketing take 1005; other majors are advised to take 1001). Students confident in math can apply for MAT1011 Honors Course, harder than 1001 but helpful for math majors. You will receive an email upon enrollment, and teachers/seniors will guide you through the course selection system. Check the Registry website for each major\'s course requirements.' },
           'faq_study_07_q': { zh: '体育课是怎么打分的呢？要算入GPA吗？', en: 'How are PE courses graded? Do they count towards GPA?' },
           'faq_study_07_a': { zh: '体育课分为笔试、技术考试和体测，体测成绩仅占5%，主要以笔试和技术考试为主。技术考试即考所选体育课的内容。老师有自己的打分标准（建议选自己擅长的项目或大家都不擅长的项目）。体育成绩算入GPA，但仅1学分，加权平均后对总GPA的影响不是特别大。', en: 'PE courses are divided into written exams, technical exams, and physical fitness tests. The fitness test score accounts for only 5%, with written and technical exams being the main components. Technical exams test the content of your chosen PE course. Teachers have their own grading standards (it is recommended to choose a sport you excel at, or one that few people are good at). PE grades count towards GPA, but it is only 1 credit, so the weighted impact on overall GPA is not significant.' },
           'faq_study_08_q': { zh: '如何评价金融工程专业？', en: 'How to evaluate the Financial Engineering major?' },
           'faq_study_08_a': { zh: '金融工程是一门交叉学科，是目前比较前沿、比较火的方向之一，结合了金融、数学和计算机的知识，由数据科学学院、经管学院和理工学院三院联合培养。', en: 'Financial Engineering is an interdisciplinary major, currently one of the more cutting-edge and popular directions, combining knowledge of finance, mathematics, and computer science. It is jointly offered by the School of Data Science, School of Management and Economics, and School of Science.' },
           'faq_study_09_q': { zh: '大一想跟教授做课题，是直接发邮件问吗？有什么建议？', en: 'I want to do research with a professor in my freshman year. Should I just email them directly? Any advice?' },
           'faq_study_09_a': { zh: '有些教授会通过多方渠道招募RA（Research Assistant），可以通过这个渠道跟项目组产生联系。如果有感兴趣的领域，可以大胆给教授发邮件表达加入意向，机会都是争取来的。', en: 'Some professors recruit RAs (Research Assistants) through various channels. You can connect with research groups through this channel. If you have an interested field, you can boldly email the professor to express your intention to join. Opportunities are all fought for.' },
           'faq_study_10_q': { zh: '学校的暑课项目平均收费多少？需要雅思或托福成绩吗？', en: 'How much does the school\'s summer course program cost on average? Do I need IELTS or TOEFL scores?' },
           'faq_study_10_a': { zh: '本校上暑课前6学分不收费，如果暑课交换到其他校区则会收费，具体视项目要求而定。', en: 'The first 6 credits of summer courses at this school are free. If you exchange to other campuses for summer courses, there will be a charge, depending on the specific program requirements.' },
           'faq_study_11_q': { zh: '学校有什么交换生或暑期项目可以申请？对GPA有要求吗？', en: 'What exchange or summer programs are available at school? Is there a GPA requirement?' },
           'faq_study_11_a': { zh: 'OAL（教务处）在暑期开始前会发送相关邮件，里面收录了本学期所有合作院校与项目以及报名链接，有些项目会对GPA有要求。', en: 'OAL (Office of Academic Links / Registry) will send relevant emails before the start of summer, which include all partner universities and programs for this semester as well as application links. Some programs have GPA requirements.' },
           'faq_study_12_q': { zh: '学校的GPA是怎么算的？满分是多少？', en: 'How is GPA calculated? What is the maximum GPA?' },
           'faq_study_12_a': { zh: '绩点按等级比例计算，满绩为4.0。对应规则为：A=4.0，A-=3.7，B+=3.3，B=3.0，B-=2.7，以此类推。具体计算方式详见教务处官网文件。', en: 'GPA is calculated on a graded proportion basis, with a maximum of 4.0. The corresponding scale is: A=4.0, A-=3.7, B+=3.3, B=3.0, B-=2.7, and so on. For the specific calculation method, please refer to the official Registry website documents.' },
           'faq_study_13_q': { zh: '入学后想转专业，有什么要求？难度大吗？', en: 'I want to transfer to another major after enrollment. What are the requirements? Is it difficult?' },
           'faq_study_13_a': { zh: '学校对于转专业非常自由，具体要求和流程可联系教务处咨询，联系方式见【常用联系方式】。', en: 'The school is very flexible about major transfer. For specific requirements and procedures, please contact the Registry. Contact information can be found in [Common Contact Information].' },
           'faq_study_14_q': { zh: '学校对英语水平有要求吗？有英语分级考试吗？', en: 'Are there English proficiency requirements? Is there an English placement test?' },
           'faq_study_14_a': { zh: '学校绝大部分课程为全英文授课；入学无英语分级考试；不强制要求考四六级。入学时若雅思总分大于6.5可豁免ENG1001，大于7.5（且小分大于7.0）可豁免ENG1001和ENG1002。其他语言考试豁免英语课要求详见教务处文件，见【常用网站及小程序 - 教务处】。', en: 'The vast majority of courses at the school are taught entirely in English; there is no English placement test upon enrollment; CET-4/6 is not mandatory. Upon enrollment, if IELTS total score is above 6.5, ENG1001 can be exempted; if above 7.5 (with each band above 7.0), both ENG1001 and ENG1002 can be exempted. For other language test exemptions for English courses, please refer to the Registry documents, see [Common Websites and Mini-programs - Registry].' },
           'faq_study_15_q': { zh: '每天有"早八"吗？上课时间是怎么安排的？', en: 'Are there 8:30 AM classes every day? How is the class schedule arranged?' },
           'faq_study_15_a': { zh: '学校第一节课时间为8:30，但课程时段由学生自己选择，不想上"早八"可以不选。', en: 'The first class of the day starts at 8:30, but students can choose their own course time slots. If you do not want 8:30 AM classes, you can avoid selecting them.' },
           'faq_life_01_q': { zh: '书院是随机分的吗？可以自选宿舍吗？可以换宿舍吗？', en: 'Are colleges randomly assigned? Can I choose my own dorm? Can I change dorms?' },
           'faq_life_01_a': { zh: '书院和宿舍都是随机分配的，如无特殊情况，可以在一学年结束时提出换宿舍申请。', en: 'Colleges and dorms are randomly assigned. Unless there are special circumstances, you can apply to change dorms at the end of an academic year.' },
           'faq_life_02_q': { zh: '床的长宽是多少？', en: 'What are the dimensions of the bed?' },
           'faq_life_02_a': { zh: '不同书院有差别，床垫的话书院也会提供（二手但清洁）的床垫，具体可以等分好宿舍和书院后再做安排。', en: 'Dimensions vary by college. The college can also provide (second-hand but clean) mattresses. Specific arrangements can be made after dorm and college assignments are completed.' },
           'faq_life_03_q': { zh: '学校有多少个食堂，味道如何？价格如何？', en: 'How many canteens are there at the school? How is the taste and price?' },
           'faq_life_03_a': { zh: '学校下园有4个食堂：学生活动中心一楼、二楼、逸夫书院的逸帆风顺、会议楼餐厅；上园在祥波书院、思廷书院、学勤书院、厚含书院也有食堂。学勤书院食堂里有麦当劳和乐凯撒。思廷书院有烧腊、云吞等正餐以及夜宵（到晚上11:30，有时12点后也有）。详见【校园地图】和【常用设施及服务】。', en: 'There are 4 canteens in Lower Campus: Student Activity Center 1F, 2F, Sir Run Run Shaw College\'s Yifan Fengshun, and Conference Building Restaurant. Upper Campus also has canteens in Harmonia College, SPC, Diligence College, and Houhan College. Diligence College canteen has McDonald\'s and Lekaisa. SPC has barbecue pork rice, wonton and other meals as well as late-night snacks (until 11:30 PM, sometimes after 12:00 AM). See [Campus Map] and [Facilities & Services].' },
           'faq_life_04_q': { zh: '宿舍和舍友是自己选的吗？', en: 'Do I choose my own dorm and roommates?' },
           'faq_life_04_a': { zh: '宿舍是随机分配的。但开学前会让大家填写作息规律和空调敏感度等问卷，按照大家相似的生活习惯进行分配。', en: 'Dorms are randomly assigned. But before the start of the semester, everyone will fill out questionnaires about daily routines and air conditioning sensitivity, and assignments are made according to similar living habits.' },
           'faq_life_05_q': { zh: '学校里有打印店吗（最好可以彩印的）？', en: 'Are there printing shops in the school (preferably with color printing)?' },
           'faq_life_05_a': { zh: '学校里随处可见自助打印机，可以黑白也可以彩色打印，黑白0.1元/页，彩色0.85元/页。可将文件上传至云打印平台，然后在打印机处微信扫码登录打印（具体使用方法可以咨询学长学姐或ITSO）。同时学校下园也有打印店可以打印或制作海报等，下沉广场也有通条文印提供打印服务。详见【常用设施及服务】。', en: 'Self-service printers can be found everywhere in the school, supporting both black-and-white (0.1 RMB/page) and color printing (0.85 RMB/page). You can upload files to the cloud printing platform and scan the WeChat QR code at the printer to log in and print (consult seniors or ITSO for specific usage). There are also printing shops in the Lower Campus for printing or poster making, and Tongtiao Wenyin in the sunken plaza also provides printing services. See [Common Facilities and Services] for details.' },
           'faq_life_06_q': { zh: '学校外卖、快递相关问题？', en: 'Questions about takeout and delivery at school?' },
           'faq_life_06_a': { zh: '外卖：学校周围外卖种类繁多，可以送到下园老南门/新南门，上园北门/祥波门，有智能外卖柜，扫码输入手机号后四位取餐。也可以加入各种外卖凑单群，午餐晚餐时间会有一些店家统一为学校配送。快递：学校上园和下园均有大量丰巢快递柜以及收发室（顺丰速运负责运营）。小件快递会被放入丰巢，大件会被送到收发室保管。学校的丰巢无论存柜多久均无任何存柜费，免费使用。同时丰巢和收发室也有寄件功能，顺丰快递还可以上门取件。', en: 'Takeout: Various types of takeout are available around the school, which can be delivered to Lower Campus Old South Gate/New South Gate, Upper Campus North Gate/Xiangbo Gate. There are smart takeout cabinets where you scan the code and enter the last 4 digits of your phone number to pick up. You can also join various takeout group orders. Delivery: Both Upper and Lower Campus have many SF Express lockers and delivery rooms (operated by SF Express). Small packages will be placed in SF lockers, large packages will be sent to the delivery room for safekeeping. The school\'s SF lockers have no storage fees regardless of duration, free to use. SF lockers and delivery rooms also have sending functions, and SF Express can also pick up packages from your door.' },
           'faq_life_07_q': { zh: '宿舍可以养（进）猫猫吗？有军训吗？有体测吗？', en: 'Can I keep (or bring) cats in the dorm? Is there military training? Is there a physical fitness test?' },
           'faq_life_07_a': { zh: '宿舍不可以养宠物！不过如果喜欢猫的话上园有很多只猫，每一只都有自己的名字，可以关注港中深动物保护协会了解学校里的猫猫们！按照以往经验，无军训，有体测。体测大概在10-11月份，标准遵循教育部制定的大学生体测标准。', en: 'Pets are not allowed in the dorms! But if you like cats, there are many cats in the Upper Campus, each with its own name. You can follow the CUHK-Shenzhen Animal Protection Association to learn about the cats on campus! According to past experience, there is no military training, but there is a physical fitness test. The test is usually in October-November, following the standards set by the Ministry of Education for college students.' },
           'faq_life_08_q': { zh: '学校录取通知书会发银行卡，手机卡什么的吗？', en: 'Does the admission letter include bank cards, phone cards, etc.?' },
           'faq_life_08_a': { zh: '银行卡是有的，中信银行。学校免费WiFi全覆盖，手机卡可以自己去营业厅办。', en: 'A bank card is included (China CITIC Bank). The school has full free WiFi coverage. You can get a phone card at service halls yourself.' },
           'faq_life_09_q': { zh: '快递费贵么？可以用快递100批量发货吗？', en: 'Is delivery expensive? Can I use Kuaidi100 for batch shipping?' },
           'faq_life_09_a': { zh: '正常价格，与市面差别不大。学校有快递服务中心，丰巢也可以寄快递。具体价格视快递公司而定。', en: 'Normal prices, not much different from the market. The school has a delivery service center, and SF Express lockers can also send packages. Specific prices depend on the courier company.' },
           'faq_life_10_q': { zh: '宿舍条件如何？几人间？有空调和独立卫浴吗？', en: 'What are the dorm conditions? How many people per room? Is there AC and private bathroom?' },
           'faq_life_10_a': { zh: '所有本科生宿舍都是四人间，大部分是上床下桌，也会为身高超过一米九的同学提供加长床；有空调；每一层有公共卫浴，淋浴间干湿分离，会有专业的物业团队提供清洁服务；每一层还有公共厨房，里面会提供冰箱、微波炉、空气炸锅、咖啡机、电灶等（具体设施以各书院实际情况为准）；每一栋的最顶层是洗衣房，里面有大量洗衣机和烘干机；每个书院还会有健身房、自习室、台球室、电视房、冥想室等各种功能房供宿生使用（具体设施以各书院实际情况为准）。', en: 'All undergraduate dorm rooms are 4-person rooms, mostly with bunk bed over desk. Extended beds are available for students taller than 1.9 meters. Air conditioning is provided. Each floor has public bathrooms/showers with separate wet and dry areas, and professional property management teams provide cleaning services. Each floor also has a public kitchen equipped with refrigerators, microwaves, air fryers, coffee machines, electric stoves, etc. (specific facilities are subject to the actual situation of each college). The top floor of each building is the laundry room, with plenty of washing machines and dryers. Each college also has various functional rooms such as gyms, study rooms, billiard rooms, TV rooms, meditation rooms, etc. for residents to use (specific facilities are subject to the actual situation of each college).' },
           'faq_life_11_q': { zh: '校园卡有什么用？怎么充值？失卡了怎么办？', en: 'What is the campus card used for? How to top up? What if I lose it?' },
           'faq_life_11_a': { zh: '校园卡可用于场地预约与验证（如图书馆研讨室开门）、校门进出（如忘带需在企微上出示电子校园卡给安保人员协助开门）、重要考试时验证身份（如未携带需签字，后续需前往相关部门重新验证）、食堂支付（但一般都直接用微信或支付宝，所以不建议向校园卡内充值）；丢失后可前往下沉广场中信银行网点内的校园卡中心补办【详见校园地图】。', en: 'The campus card can be used for venue reservation and verification (e.g. opening library group study rooms), campus entry/exit (if forgotten, you need to show the e-campus card on WeCom to security staff for assistance), identity verification during important exams (if not carried, you need to sign and later go to the relevant department for re-verification), and cafeteria payment (but most people directly use WeChat or Alipay, so top-up is not recommended). If lost, you can go to the campus card center inside the CITIC Bank branch at the Sunken Plaza to get a replacement [see campus map for details].' },
           'faq_life_12_q': { zh: '学校的WiFi怎么连？网速快吗？', en: 'How to connect to the school WiFi? Is the speed fast?' },
           'faq_life_12_a': { zh: '学校有免费WiFi，输入CUHK(SZ)账密后可免费连接；网速在正常情况下可以满足日常使用；宿舍内也提供有线网络接口。', en: 'The school has free WiFi. You can connect for free after entering your CUHK(SZ) account and password. The speed is generally sufficient for daily use under normal circumstances. Dorm rooms also provide wired network ports.' },
           'faq_life_14_q': { zh: '校内可以骑电动车或自行车吗？有没有共享电动车？需不需要上牌？', en: 'Can I ride an electric bike or bicycle on campus? Are there shared e-bikes? Do I need a license plate?' },
           'faq_life_14_a': { zh: '为了师生安全，学校采取较严格的交通管制措施。自2025年起不再颁发电瓶车牌，可以骑自行车；校内没有共享自行车，但会有免费校巴供师生代步。', en: 'For the safety of teachers and students, the school adopts strict traffic control measures. Since 2025, electric bike licenses are no longer issued, but bicycles are allowed. There are no shared bicycles on campus, but free campus shuttles are available for commuting.' },
           'faq_life_15_q': { zh: '学校有哪些奖学金或助学金可以申请？家庭经济困难有什么支持吗？', en: 'What scholarships or financial aid are available at school? What support is there for students with financial difficulties?' },
           'faq_life_15_a': { zh: '奖助学金详情可以咨询OSA（学生事务处），OSA联系方式见【常用联系方式】。', en: 'For details on scholarships and financial aid, please contact OSA (Office of Student Affairs). OSA contact information can be found in [Common Contact Information].' },
           'faq_life_16_q': { zh: '生病了去哪里看病？社康中心在哪里？医保怎么用？', en: 'Where to go when I am sick? Where is the Shekang Center? How to use medical insurance?' },
           'faq_life_16_a': { zh: '上园和下园都设有社康中心，就诊前可在"社康通"小程序中预约并出示社保码，详见【常用网站及小程序 - 常用小程序 - 社康通】。', en: 'There are Shekang Centers in both Upper and Lower Campus. Before visiting, you can make an appointment and show your social security code in the "Shekang Tong" mini-program. For details, see [Useful Websites & Mini-programs - Common Mini-programs - Shekang Tong].' },
           'faq_life_17_q': { zh: '学校有心理辅导或心理咨询服务吗？怎么预约？', en: 'Does the school have psychological counseling services? How to make an appointment?' },
           'faq_life_17_a': { zh: '学校设有学生健康辅导中心（SHCC），联系方式见【常用联系方式 - 行政部门 - SHCC】。', en: 'The school has a Student Health and Counseling Center (SHCC). Contact information can be found in [Common Contact Information - Administrative Departments - SHCC].' },
           'faq_life_18_q': { zh: '图书馆怎么样？怎么预约研讨室？怎么借书？', en: 'What is the library like? How to reserve a group study room? How to borrow books?' },
           'faq_life_18_a': { zh: '图书馆提供多样化的自习和讨论环境，以及丰富的线上线下资源；研讨室需在企业微信 - 工作台 - 场地预约中预约；借书可在图书馆网站中查阅并申请借阅，详见【常用网站及小程序】。', en: 'The library provides diverse self-study and discussion environments, as well as rich online and offline resources. Group study rooms need to be reserved via WeCom - Workbench - Venue Reservation. Books can be searched and borrowed via the library website, see [Common Websites and Mini-programs] for details.' },
           'faq_life_20_q': { zh: '学校有校巴吗？有哪些线路？', en: 'Does the school have campus shuttles? What routes are available?' },
           'faq_life_20_a': { zh: '学校共有一号线、二号线、三号线（高峰线）、四号线和音乐学院线等校内巴士，以及若干校外穿梭巴士。具体线路和运营时间可见【常用网站及小程序 - 智行港中深】。', en: 'The school has Route 1, Route 2, Route 3 (peak-hour only), Route 4, and the Music School Route, as well as several off-campus shuttle buses. For specific routes and operating hours, see [Common Websites and Mini-programs - Smart CUHK-SZ].' },
           'faq_life_21_q': { zh: '入学需要带哪些行李物品？学校可以买生活用品吗？', en: 'What luggage should I bring for enrollment? Can I buy daily necessities on campus?' },
           'faq_life_21_a': { zh: '生活物品看个人所需。学校上园和下园有全家、罗森、天猫便利店可以购买物资；每个书院也配有丰巢快递柜，网购很方便。', en: 'Daily necessities depend on personal needs. There are FamilyMart, Lawson, and Tmall campus convenience stores in both Upper and Lower Campus for purchasing supplies. Each college is also equipped with Hive Box lockers, making online shopping very convenient.' },
           'faq_life_22_q': { zh: '学校有哪些运动场馆？需要预约吗？', en: 'What sports facilities are available on campus? Do I need a reservation?' },
           'faq_life_22_a': { zh: '游泳池位于大学体育馆（详见【校园地图】），刷学生卡可直接进入，无需预约。大学体育馆一楼设有健身馆，部分书院内也配有较小的健身房。羽毛球场、匹克球场、乒乓球场位于综合体育馆，其中羽毛球场需在企业微信 - 工作台 - 场地预约中预约。室内篮球场位于大学体育馆，室外篮球场位置详见【校园地图】。此外还有各类运动设施分布在大学体育馆和综合体育馆，等待同学们探索。', en: 'The swimming pool is located in the University Gymnasium (see [Campus Map] for details), and you can enter directly by swiping your student card without reservation. The first floor of the University Gymnasium has a fitness room, and some colleges also have smaller gyms. Badminton courts, pickleball courts, and table tennis courts are located in the Comprehensive Gymnasium, among which badminton courts need to be reserved via WeCom - Workbench - Venue Reservation. Indoor basketball courts are in the University Gymnasium, and outdoor basketball court locations are detailed in [Campus Map]. In addition, there are various sports facilities distributed in the University Gymnasium and Comprehensive Gymnasium waiting for students to explore.' },
           'faq_life_23_q': { zh: '书院自习室是24小时的吗？图书馆考试周开放到几点？', en: 'Are college study rooms open 24 hours? How late is the library open during exam weeks?' },
           'faq_life_23_a': { zh: '各书院的自习室为24小时开放；期末周期间图书馆也24小时开放。图书馆内设有公共电脑区域，配有显示屏供使用。', en: 'Study rooms in each college are open 24 hours. During final exam weeks, the library is also open 24 hours. The library has public computer areas equipped with monitors for use.' },
           'faq_life_24_q': { zh: '社康中心能看哪些病？能不能开病假条？', en: 'What ilnesses can the Shekang Center treat? Can it issue medical leave certificates?' },
           'faq_life_24_a': { zh: '社康中心有全科医师坐诊，可以开具医疗证明；但大病或严重症状建议直接前往附近大医院就诊。', en: 'The Shekang Center has general practitioners on duty and can issue medical certificates. However, for serious ilnesses or severe symptoms, it is recommended to go directly to a nearby hospital.' },
           'faq_life_25_q': { zh: '个人档案（学生档案）怎么转递到学校？', en: 'How do I transfer my personal student archive to the school?' },
           'faq_life_25_a': { zh: '内地学生：档案可通过以下方式转递：①自带：凭录取通知书到原档案存放单位领取，入学报到时交至学校；②EMS邮寄：由档案存放单位通过EMS直接邮寄至学校（邮寄地址：广东省深圳市龙岗区龙翔大道2001号香港中文大学（深圳）学生事务处，电话0755-84273118）。港澳台及国际学生：无需转递内地个人档案。⚠️档案不可拆封！拆封后档案将失效。', en: 'Mainland students: Archives can be transferred via: ① Self-carry: Collect from the original archive unit with your admission letter, submit during registration; ② EMS mailing: The archive unit mails via EMS directly to the school (Address: CUHK-Shenzhen Student Affairs Office, 2001 Longxiang Ave, Longgang, Shenzhen, Guangdong; Tel: 0755-84273118). HK/Macao/Taiwan & international students: No mainland personal archive transfer needed. ⚠️ Do NOT open the archive seal! Opened archives become invalid.' },
           'faq_fun_01_q': { zh: '学校附近有什么商场或休闲娱乐场所？', en: 'What shopping malls or entertainment venues are near the school?' },
           'faq_fun_01_a': { zh: '离学校最近的商场是大运天地，稍远一点还有龙岗星河COCO Park，COCO Park里有海底捞等各类饭店，有电影院，还有山姆会员超市。同时学校周围还有万科广场、万科里等，基本可满足日常逛街、外出吃饭、看电影等需求。学校附近还有大运自然公园等休闲娱乐场所。', en: 'The nearest shopping mall to the school is Dayun Tiandi. A bit further away is Longgang COCO Park, which has various restaurants including Haidilao, a cinema, and Sam\'s Club. There are also Vanke Plaza and Vanke Li around the school, which basically meet daily needs for shopping, dining out, and watching movies. There are also recreational venues like Dayun Nature Park near the school.' },
           'faq_fun_02_q': { zh: '校乐团非音乐学院学生可以参加吗？要怎样考核呢？', en: 'Can non-Music School students join the school orchestra? How is the audition?' },
           'faq_fun_02_a': { zh: '学校艺术团体分为三大团：校合唱团、管弦乐团和民乐团。全校全体师生都可以通过报名→考核的流程加入艺术团体。合唱团的考核包括：清唱自选歌曲片段 + 现场视唱（可自选五线谱/简谱）+ 音域测试。通过考核的成员会收到邮件通知并告知所在声部（女高/女低/男高/男低）。合唱团每周排练两次，会参加学校年度音乐会演出以及合唱团专场演出。', en: 'The school\'s art groups are divided into three major groups: the School Choir, Orchestra, and Chinese Music Orchestra. All teachers and students of the school can join the art groups through the registration → audition process. The choir audition includes: a cappella singing of a self-selected song excerpt + on-site sight-singing (can choose between staff notation or numbered musical notation) + vocal range test. Members who pass the audition will receive email notification and be informed of their voice section (soprano/alto/tenor/bass). The choir rehearses twice a week and participates in the school\'s annual concert and the choir\'s special performance.' },
           'faq_fun_03_q': { zh: '社团管理层或是学生会干部在日后国外offer申请时有帮助吗？', en: 'Are club leadership or student union roles helpful for future overseas offer applications?' },
           'faq_fun_03_a': { zh: '申请是一件很综合的事，可以说你在学校做的所有事都可能对申请有影响。除了目标学校官网公布的申请条件，没有什么是一定必要或不必要的。经历丰富一点可能会让审核人员看到你的多元化和发展潜力。', en: 'Application is a very comprehensive matter. It can be said that everything you do at school may have an impact on your application. Except for the application requirements published on the target school\'s official website, nothing is absolutely necessary or unnecessary. Having richer experiences may allow reviewers to see your diversity and development potential.' },
           'faq_fun_04_q': { zh: '新生舞会是必须参加吗？', en: 'Is the freshman dance mandatory?' },
           'faq_fun_04_a': { zh: '不是，完全自愿！新生舞会是学校传统的迎新活动之一，可以认识新朋友、体验社交舞，有兴趣的同学可以参加。', en: 'No, completely voluntary! The freshman dance is one of the school\'s traditional welcome activities, where you can meet new friends and experience social dancing. Interested students can participate.' },
           'faq_hint':      { zh: '📝 此处等待添加更多常见问题和详细解答...', en: '📝 More FAQs and detailed answers to be added here...' },
           'web_01_title': { zh: '香港中文大学（深圳）官网', en: 'CUHK (Shenzhen) Official Website'},
           'web_01_desc': { zh: '学校官方网站。在校生可查看各自专业的修读计划，提前做好规划。', en: 'Official university website. Students can check their major\'s study plan for early planning.'},
           'web_01_btn': { zh: '访问官网', en: 'Open Website' },
           'web_02_title': { zh: '教务处官网', en: 'Registry Office Website'},
           'web_02_desc': { zh: '用于选课，主修/选修课的建议以及参考。内网访问。', en: 'For course selection and major/minor advising. Intranet access required.'},
           'web_02_btn': { zh: '访问教务处', en: 'Open Website' },
           'web_03_title': { zh: '学校内网（i.cuhk）', en: 'University Intranet (i.cuhk)'},

           'fac_canteen_intro': { zh: '学校现设8家食堂，分别位于学生中心、逸夫书院、思廷书院、永平书院、会议楼Ⅰ以及音乐学院。学生中心一楼食堂设有13个风味档口，为师生提供各色餐食；学生中心二楼食堂为湘赣风味食堂；逸帆风顺食堂（逸夫书院）为陕西风味食堂；海月廷食堂（思廷书院）为粤式风味食堂；东南西北风食堂为江浙风味+东南亚风味食堂；会议楼Ⅰ一楼食堂为特色品牌食堂；音乐学院食堂为大众食堂。', en: 'There are 8 canteens on campus, located at the Student Centre, Shaw College, Muse College, Yongping College, Conference Building I, and the Music School. The Student Centre 1/F canteen offers 13 food stalls with diverse cuisines; 2/F serves Hunan & Jiangxi cuisine; Yifan Fengshun (Shaw College) serves Shaanxi cuisine; Haiyueting (Muse College) offers Cantonese cuisine; Dongnan Xibeifeng features Jiang-Zhe and Southeast Asian cuisine; Conference Building I 1/F is a specialty brand canteen; and the Music School canteen provides general dining.' },

    function applyTranslations(lang) {
        var els = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < els.length; i++) {
            var el = els[i];
            var key = el.getAttribute('data-i18n');
            if (dict[key] && dict[key][lang]) {
                var val = dict[key][lang];
                if (dict[key].attr) {
                    el.setAttribute(dict[key].attr, val);
                } else if (dict[key].html) {
                    el.innerHTML = val;
                } else {
                    el.textContent = val;
                }
            }
        }
        // Process data-i18n-attr-* attributes for multi-attribute translation
        els = document.querySelectorAll('[data-i18n-attr-aria-label], [data-i18n-attr-title], [data-i18n-attr-alt]');
        for (var i = 0; i < els.length; i++) {
            var el = els[i];
            var attrs = el.attributes;
            for (var j = 0; j < attrs.length; j++) {
                var attrName = attrs[j].name;
                if (attrName.indexOf('data-i18n-attr-') === 0) {
                    var targetAttr = attrName.substring('data-i18n-attr-'.length);
                    var key = attrs[j].value;
                    if (dict[key] && dict[key][lang]) {
                        el.setAttribute(targetAttr, dict[key][lang]);
                    }
                }
            }
        }
        // Update page title
        var titleKey = document.body.getAttribute('data-page') + '_title';
        if (dict[titleKey] && dict[titleKey][lang]) {
            document.title = dict[titleKey][lang];
        }
        // Dispatch custom event for other scripts
        var event = new CustomEvent('i18nChanged', { detail: { lang: lang } });
        document.dispatchEvent(event);
    }

function initI18n() {
        applyTranslations(currentLang);
        updateLangBtn();

        // 绑定切换按钮事件（只绑一次，兼容所有页面）
        if (!_langBound) {
            _langBound = true;
            document.addEventListener('click', function(e) {
                var btn = e.target.closest ? e.target.closest('#langSwitchBtn') : null;
                if (btn) {
                    currentLang = currentLang === 'zh' ? 'en' : 'zh';
                    applyTranslations(currentLang);
                    updateLangBtn();
                }
            });
        }
    }

        var btn = document.getElementById('langSwitchBtn');
        if (!btn) return;
        btn.textContent = currentLang === 'zh' ? 'EN' : '中';
    }

/* ===================================
   主题切换 | Theme Toggle
   =================================== */

// 初始化主题（在 head 同步脚本中调用，也在 DOMContentLoaded 中备用）
function initTheme() {
    // 优先使用用户保存的选择
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);
        return;
    }
    
    // 否则跟随系统
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
        updateThemeIcon('dark');
    }
}

// 切换主题
function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    updateThemeIcon(newTheme);
}

// 更新切换按钮图标
function updateThemeIcon(theme) {
    const icons = document.querySelectorAll('.theme-icon');
    icons.forEach(icon => { icon.textContent = theme === 'dark' ? '☀️' : '🌙'; });
}

// 绑定主题按钮点击（只调用一次）
function bindThemeToggle() {
    const ids = ['theme-toggle', 'theme-toggle-header'];
    ids.forEach(id => {
        const btn = document.getElementById(id);
        if (btn && !btn._themeBound) {
            btn.addEventListener('click', toggleTheme);
            btn._themeBound = true;
        }
    });
}

// 监听系统主题变化
if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        // 只有用户没手动选择时才跟随系统
        if (!localStorage.getItem('theme')) {
            const newTheme = e.matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            updateThemeIcon(newTheme);
        }
    });
}

// 页面加载时初始化（绑定点击 + 初始化主题）
document.addEventListener('DOMContentLoaded', () => {
    bindThemeToggle();
    // 如果 head 同步脚本没跑（降级），在这里补跑
    const currentTheme = document.documentElement.getAttribute('data-theme');
    if (!currentTheme) {
        initTheme();
    } else {
        updateThemeIcon(currentTheme);
    }
});


// 绑定主题按钮（DOM 已解析，直接调用）
if (window.bindThemeToggle) bindThemeToggle();
// 降级：若 head 同步脚本未执行，在此补初始化
if (!document.documentElement.getAttribute('data-theme')) {
    if (window.initTheme) initTheme();
}

// ═══ 手势支持：右滑返回 ═══
(function initSwipeGesture() {
    var startX = 0;
    var startY = 0;
    var isSwiping = false;
    var SWIPE_THRESHOLD = 80; // 最小滑动距离
    var EDGE_THRESHOLD = 30; // 从屏幕边缘开始滑动的距离

    document.addEventListener('touchstart', function(e) {
        var touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        // 只从屏幕左边缘开始识别
        if (startX < EDGE_THRESHOLD) {
            isSwiping = true;
        }
    }, { passive: true });

    document.addEventListener('touchmove', function(e) {
        if (!isSwiping) return;
        // passive 监听器，不做阻止
    }, { passive: true });

    document.addEventListener('touchend', function(e) {
        if (!isSwiping) return;
        isSwiping = false;

        var touch = e.changedTouches[0];
        var deltaX = touch.clientX - startX;
        var deltaY = Math.abs(touch.clientY - startY);

        // 右滑：deltaX > 阈值，且纵向移动不大
        if (deltaX > SWIPE_THRESHOLD && deltaY < SWIPE_THRESHOLD / 2) {
            // 不在登录页才能返回
            if (__currentPage && __currentPage !== 'login') {
                // 模拟返回首页
                if (window.goBack) goBack();
            }
        }
    }, { passive: true });
})();

    if ('ontouchstart' in window) {
        document.addEventListener('touchstart', function() {}, { passive: true });
    }
})();

function showPage(name) {
    if (__currentPage === name) return;
    __currentPage = name;

    var root = document.getElementById('app-root');
    var tpl = document.getElementById('tpl-' + name);
    if (!tpl) { console.error('Template not found:', name); return; }

    root.innerHTML = '';
    root.appendChild(tpl.content.cloneNode(true));

    // 登录页隐藏底部导航，其他页面显示
    var bottomNav = document.querySelector('.mobile-bottom-nav');
    if (bottomNav) {
        if (name === 'login') {
            bottomNav.classList.add('nav-hidden');
        } else {
            bottomNav.classList.remove('nav-hidden');
        }
    }

    // 首页用顶部导航栏内的主题按钮，其他页面用悬浮按钮（仅桌面端）
    var isDesktop = window.innerWidth > 768;
    var shellTheme = document.getElementById('theme-toggle');

    if (shellTheme) {
        if (name === 'main' && isDesktop) {
            // 首页桌面端：主题按钮在导航栏内，隐藏悬浮按钮
            shellTheme.style.display = 'none';
        } else {
            // 其他板块桌面端：悬浮按钮显示在翻译按钮正下方
            shellTheme.style.display = 'flex';
            shellTheme.style.position = 'fixed';
            shellTheme.style.top = '56px';
            shellTheme.style.right = '16px';
            shellTheme.style.zIndex = '10001';
        }
    }

    // 绑定首页顶部导航栏内的主题按钮（每次切到首页都需要重新绑定）
    if (name === 'main' && window.bindThemeToggle) {
        window.bindThemeToggle();
    }

    // 更新移动端底部导航高亮
    updateMobileNav(name);

    // Shim: make DOMContentLoaded fire immediately (DOM is already loaded in SPA)
    var origAddEventListener = document.addEventListener;
    document.addEventListener = function(type, fn, opts) {
        if (type === 'DOMContentLoaded') {
            try { fn.call(document, { type: 'DOMContentLoaded' }); } catch(e) { console.error('DOMContentLoaded error:', e); }
            return;
        }
        origAddEventListener.call(document, type, fn, opts);
    };

    // Run page-specific scripts
    var scripts = pageScripts[name] || [];
    scripts.forEach(function(code) {
        try {
            var el = document.createElement('script');
            el.textContent = code;
            root.appendChild(el);
            root.removeChild(el);
        } catch(e) {
            console.error('Page script error (' + name + '):', e);
        }
    });

    // Restore addEventListener
    document.addEventListener = origAddEventListener;

    // Apply i18n translations
    if (window.i18n && window.i18n.initI18n) {
        window.i18n.initI18n();
    }

    // Scroll to top
    window.scrollTo(0, 0);
}

// Navigate functions (called from HTML onclick)
function navigateTo(page) {
    showPage(page.replace('.html', ''));
}
function goBack() {
    showPage('main');
}
function logout() {
    if (confirm('确定要切换学校吗？')) {
        showPage('login');
    }
}

function openMiniApp(name) {
    var overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);z-index:99999;display:flex;align-items:center;justify-content:center;";
    var box = document.createElement("div");
    box.style.cssText = "background:#fff;border-radius:18px;padding:28px 22px;max-width:310px;width:82%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.25);";
    var title = document.createElement("div");
    title.style.cssText = "font-size:17px;font-weight:700;color:#222;margin-bottom:12px;";
    title.textContent = "小程序";
    var nameBox = document.createElement("div");
    nameBox.style.cssText = "font-size:18px;color:#667eea;background:#f0f2ff;padding:12px;border-radius:10px;margin-bottom:16px;font-weight:600;";
    nameBox.textContent = name;
    var hint = document.createElement("div");
    hint.style.cssText = "font-size:13px;color:#999;line-height:1.7;margin-bottom:18px;";
    hint.innerHTML = "请复制以上名称，<br>在微信顶部搜索框粘贴并搜索";
    var btn = document.createElement("button");
    btn.style.cssText = "padding:10px 40px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;";
    btn.textContent = "知道了";
    btn.onclick = function() { overlay.remove(); };
    box.appendChild(title);
    box.appendChild(nameBox);
    box.appendChild(hint);
    box.appendChild(btn);
    overlay.appendChild(box);
    overlay.addEventListener("click", function(e) { if(e.target===overlay) overlay.remove(); });
    document.body.appendChild(overlay);
}


// Initialize - show login page
document.addEventListener('DOMContentLoaded', function() {
    showPage('login');

    // ═══ Back to Top Button ═══
    var btn = document.createElement('button');
    btn.className = 'back-to-top';
    btn.innerHTML = '↑';
    btn.setAttribute('aria-label', '回到顶部');
    btn.title = '回到顶部';
    document.body.appendChild(btn);

    window.addEventListener('scroll', function() {
        if (window.scrollY > 300) {
            btn.classList.add('show');
        } else {
            btn.classList.remove('show');
        }
    });

    btn.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
});
